t:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">03.</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Scenarios</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">&amp;</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Sensitivities</span></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> Eseguire simulazioni di scenari e analisi di sensitivit&#xe0; (stress test su cambi, volumi e costi);","children":[],"payload":{"tag":"li","lines":"230,232"}},{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mn mathvariant=\"bold\">04.</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">R</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">k</mi><mi mathvariant=\"bold\">s</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">&amp;</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">O</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">u</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">s</mi></mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{04.\\ Risks\\ \\&amp;\\ Opportunities} \nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">04.</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Risks</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">&amp;</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Opportunities</span></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> Mappare e quantificare sia i rischi al ribasso sia le opportunit&#xe0; di rialzo (<em>upside</em>);","children":[],"payload":{"tag":"li","lines":"232,234"}},{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mn mathvariant=\"bold\">05.</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">R</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">c</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">&amp;</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">c</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi></mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{05.\\ Recommendation\\ \\&amp;\\ Decision} \nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">05.</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Recommendation</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">&amp;</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Decision</span></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> Presentare al vertice aziendale alternative rese confrontabili per decidere in modo consapevole.","children":[],"payload":{"tag":"li","lines":"234,237"}}],"payload":{"tag":"li","lines":"225,237"}}],"payload":{"tag":"h2","lines":"210,211"}},{"content":"7. IAS 16 &#x2013; Property, Plant and Equipment","children":[{"content":"<strong>Definizione e Criteri di Rilevazione Iniziale</strong>","children":[{"content":"Beni materiali posseduti per essere utilizzati nella produzione, fornitura di beni/servizi, locazione o scopi amministrativi per pi&#xf9; di un esercizio.","children":[],"payload":{"tag":"li","lines":"239,240"}},{"content":"Si iscrivono all&apos;attivo se &#xe8; probabile l&apos;afflusso di benefici economici futuri e se il costo &#xe8; misurabile attendibilmente.","children":[],"payload":{"tag":"li","lines":"240,241"}}],"payload":{"tag":"li","lines":"238,241"}},{"content":"<strong>Valutazione Iniziale: Cosa Entra nel Costo e Cosa NO</strong>","children":[{"content":"<strong>Componenti Capitalizzabili nel Costo</strong>:","children":[{"content":"1. Prezzo di acquisto al netto di sconti commerciali e abbuoni (+ dazi e imposte di acquisto non recuperabili);","children":[],"payload":{"tag":"li","lines":"243,244","listIndex":1}},{"content":"2. Costi direttamente attribuibili per portare il bene nel luogo e nelle condizioni operative volute dal management (sbancamento terreno, trasporto, installazione, compensi professionali di periti e architetti);","children":[],"payload":{"tag":"li","lines":"244,245","listIndex":2}},{"content":"3. <strong>Costi di Collaudo e Test</strong>: i proventi derivanti dalla vendita di campioni prodotti durante la fase di test vanno a Conto Economico tra i ricavi ordinari (e non pi&#xf9; a decurtazione del cespite);","children":[],"payload":{"tag":"li","lines":"245,246","listIndex":3}},{"content":"4. <strong>Stima Attualizzata dei Costi di Smantellamento e Bonifica (<em>Decommissioning</em>)</strong>: Se l&apos;impresa ha un&apos;obbligazione legale o contrattuale a smantellare l&apos;impianto e ripristinare il sito a fine vita utile (es. piattaforma petrolifera o parco eolico), il valore attuale di tali costi futuri si aggiunge subito al costo del cespite con contropartita una passivit&#xe0;/fondo rischi ex <strong>IAS 37</strong>.","children":[],"payload":{"tag":"li","lines":"246,247","listIndex":4}}],"payload":{"tag":"li","lines":"242,247"}},{"content":"<strong>Componenti Categoricamente ESCLUSE dal Costo (Sempre a P&amp;L)</strong>:","children":[{"content":"<strong>Spese di Formazione del Personale</strong>: il personale non &#xe8; sotto il controllo giuridico dell&apos;azienda ex Framework;","children":[],"payload":{"tag":"li","lines":"248,249"}},{"content":"Spese di marketing, pubblicit&#xe0; e inaugurazione di nuovi stabilimenti;","children":[],"payload":{"tag":"li","lines":"249,250"}},{"content":"Costi sostenuti mentre un impianto opera a capacit&#xe0; ridotta o &#xe8; in attesa di essere utilizzato;","children":[],"payload":{"tag":"li","lines":"250,251"}},{"content":"Spese generali e amministrative.","children":[],"payload":{"tag":"li","lines":"251,252"}}],"payload":{"tag":"li","lines":"247,252"}}],"payload":{"tag":"li","lines":"241,252"}},{"content":"<strong>Il Component Approach (Approccio per Componenti - Obbligatorio)</strong>","children":[{"content":"Se un cespite &#xe8; formato da parti significative che hanno una vita utile dissimile o un differente ritmo di consumo economico, ciascuna parte <strong>deve essere iscritta e ammortizzata separatamente</strong>.","children":[],"payload":{"tag":"li","lines":"253,254"}},{"content":"<strong>Esempio Classico (L&apos;Aereo)</strong>: Fusoliera ammortizzata in 25 anni; Motori ammortizzati in 10 anni (o in ore di volo); Allestimenti e sedili interni ammortizzati in 5 anni per rapida usura.","children":[],"payload":{"tag":"li","lines":"254,255"}},{"content":"<strong>Esempio dei Fabbricati</strong>: I terreni e gli edifici sono beni separabili anche se acquistati insieme. Il <strong>terreno ha vita utile illimitata e non si ammortizza mai</strong>; l&apos;edificio soprastante ha vita utile limitata e si ammortizza.","children":[],"payload":{"tag":"li","lines":"255,256"}},{"content":"<strong>Sostituzione di Componenti</strong>: Il costo del nuovo componente installato si capitalizza, mentre il valore contabile residuo del vecchio pezzo rimosso viene stornato (<em>derecognised</em>) dal bilancio con imputazione a P&amp;L.","children":[],"payload":{"tag":"li","lines":"256,257"}}],"payload":{"tag":"li","lines":"252,257"}},{"content":"<strong>Valutazione Successiva: Cost Model vs Revaluation Model</strong>","children":[{"content":"<strong>1. Modello del Costo (<em>Cost Model</em>)</strong>:","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>V</mi><mi>a</mi><mi>l</mi><mi>o</mi><mi>r</mi><mi>e</mi><mi>C</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>a</mi><mi>b</mi><mi>i</mi><mi>l</mi><mi>e</mi></mrow><mo>=</mo><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>C</mi><mi>o</mi><mi>s</mi><mi>t</mi><mi>o</mi><mi>S</mi><mi>t</mi><mi>o</mi><mi>r</mi><mi>i</mi><mi>c</mi><mi>o</mi></mrow><mo>&#x2212;</mo><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>F</mi><mi>o</mi><mi>n</mi><mi>d</mi><mi>o</mi><mi>A</mi><mi>m</mi><mi>m</mi><mi>o</mi><mi>r</mi><mi>t</mi><mi>a</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi><mi>o</mi><mi>A</mi><mi>c</mi><mi>c</mi><mi>u</mi><mi>m</mi><mi>u</mi><mi>l</mi><mi>a</mi><mi>t</mi><mi>o</mi></mrow><mo>&#x2212;</mo><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>P</mi><mi>e</mi><mi>r</mi><mi>d</mi><mi>i</mi><mi>t</mi><mi>e</mi><mi>d</mi><mi>a</mi><mi>I</mi><mi>m</mi><mi>p</mi><mi>a</mi><mi>i</mi><mi>r</mi><mi>m</mi><mi>e</mi><mi>n</mi><mi>t</mi><mo stretchy=\"false\">(</mo><mi>I</mi><mi>A</mi><mi>S</mi><mn>36</mn><mo stretchy=\"false\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Valore Contabile} = \text{Costo Storico} - \text{Fondo Ammortamento Accumulato} - \text{Perdite da Impairment (IAS 36)}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span>< "mord mathnormal\">A</span><span class=\"mord mathnormal\">mm</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">am</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">A</span><span class=\"mord mathnormal\">cc</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\">m</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">o</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">er</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0785em;\">I</span><span class=\"mord mathnormal\">m</span><span class=\"mord mathnormal\">p</span><span class=\"mord mathnormal\">ai</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">m</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">t</span><span class=\"mopen\">(</span><span class=\"mord mathnormal\" style=\"margin-right:0.0785em;\">I</span><span class=\"mord mathnormal\">A</span><span class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">S</span><span class=\"mord\">36</span><span class=\"mclose\">)</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"259,260"}}],"payload":{"tag":"li","lines":"258,260"}},{"content":"<strong>2. Modello della Rideterminazione del Valore (<em>Revaluation Model</em>)</strong>:","children":[{"content":"Il cespite viene rivalutato periodicamente al suo <strong>Fair Value</strong>.","children":[],"payload":{"tag":"li","lines":"261,262"}},{"content":"<strong>Scrittura Contabile di Rivalutazione (Quesito 06.4)</strong>: Un impianto passa da &#x20ac;80.000 a &#x20ac;95.000 senza precedenti svalutazioni:<br>\n<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">I</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext><mn mathvariant=\"bold\">15.000</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">/</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">A</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">R</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">a</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">R</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">l</mi><mi mathvariant=\"bold\">u</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">z</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">O</mi><mi mathvariant=\"bold\">C</mi><mi mathvariant=\"bold\">I</mi><mo stretchy=\"false\">)</mo><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext><mn mathvariant=\"bold\">15.000</mn></mrow><annotation encoding=\"application/x-tex\">\\mathbf{Dare\\ Impianti\\ &#x20ac;15.000\\ /\\ Avere\\ Riserva\\ di\\ Rivalutazione\\ (OCI)\\ &#x20ac;15.000}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">Dare</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Impianti</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span><span class=\"mord mathbf\">15.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">/</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Avere</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Riserva</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">di</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Rivalutazione</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">OCI</span><span class=\"mclose\">)</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span><span class=\"mord mathbf\">15.000</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"262,264"}},{"content":"<strong>Trattamento delle Variazioni Successive</strong>:","children":[{"content":"Una rivalutazione positiva va a <strong>OCI</strong> (Riserva di rivalutazione / Revaluation Surplus) e non tocca il P&amp;L;","children":[],"payload":{"tag":"li","lines":"265,266"}},{"content":"Una svalutazione successiva va prima ad assorbire e azzerare la riserva OCI preesistente; solo l&apos;eventuale eccedenza diventa costo a Conto Economico (P&amp;L);","children":[],"payload":{"tag":"li","lines":"266,267"}},{"content":"Se in passato c&apos;era stata una svalutazione a P&amp;L, una successiva rivalutazione va a <strong>P&amp;L come ripristino di valore</strong> fino a concorrenza della perdita passata, e solo l&apos;eccedenza va a riserva OCI.","children":[],"payload":{"tag":"li","lines":"267,268"}}],"payload":{"tag":"li","lines":"264,268"}},{"content":"<strong>IL DIVIETO CATEGORICO DI RECYCLING ALLA VENDITA</strong>: Quando il bene rivalutato viene definitivamente venduto a terzi, la riserva di rivalutazione residua accumulata a patrimonio netto <strong>NON transita mai per il Conto Economico (P&amp;L)</strong>; viene girata direttamente a <em>Utili portati a nuovo</em> (<em>Retained Earnings</em>) all&apos;interno del Patrimonio Netto.","children":[],"payload":{"tag":"li","lines":"268,269"}}],"payload":{"tag":"li","lines":"260,269"}}],"payload":{"tag":"li","lines":"257,269"}},{"content":"<strong>Regole di Ammortamento</strong>","children":[{"content":"<strong>Valore Ammortizzabile</strong>: Costo (o Fair Value) al netto del <strong>Valore Residuo</strong> stimato a fine vita utile (valore netto di dismissione se il cespite fosse gi&#xe0; a fine vita).","children":[],"payload":{"tag":"li","lines":"270,271"}},{"content":"<strong>Decorrenza</strong>: L&apos;ammortamento inizia nel momento in cui il bene &#xe8; <strong>disponibile all&apos;uso</strong> (collocato nel luogo e nelle condizioni operative previste dal management), <strong>NON quando inizia a essere effettivamente impiegato nella produzione</strong>.","children":[],"payload":{"tag":"li","lines":"271,272"}},{"content":"<strong>Continuit&#xe0;</strong>: L&apos;ammortamento <strong>NON si sospende</strong> se l&apos;impianto rimane temporaneamente inattivo o sottoutilizzato.","children":[],"payload":{"tag":"li","lines":"272,273"}},{"content":"<strong>Revisione Annuale delle Stime</strong>: Vita utile, valore residuo e criterio di ammortamento devono essere riesaminati alla chiusura di ogni esercizio contabile. Eventuali variazioni si trattano come <strong>cambiamenti di stime contabili ex IAS 8 con effetto prospettico</strong> (non si toccano i bilanci passati).","children":[],"payload":{"tag":"li","lines":"273,275"}}],"payload":{"tag":"li","lines":"269,275"}}],"payload":{"tag":"h2","lines":"237,238"}},{"content":"8. IFRS 5 &#x2013; Attivit&#xe0; Possedute per la Vendita &amp; Discontinued Operations","children":[{"content":"<strong>Attivit&#xe0; Non Correnti Possedute per la Vendita (<em>Held for Sale</em>)</strong>","children":[{"content":"<strong>Il Cambio di Prospettiva Economica</strong>: Il valore contabile del bene non sar&#xe0; pi&#xf9; recuperato tramite l&apos;uso continuativo nel processo produttivo, ma attraverso una <strong>transazione di cessione sul mercato</strong>.","children":[],"payload":{"tag":"li","lines":"277,278"}},{"content":"<strong>I 2 Criteri Tassativi Cumulativi (Quesito 07.1)</strong>:","children":[{"content":"1. Il bene deve essere <strong>disponibile per la vendita immediata nelle condizioni attuali</strong> (soggetto solo alle clausole commerciali d&apos;uso; non deve richiedere modifiche o ristrutturazioni preventive);","children":[],"payload":{"tag":"li","lines":"279,280","listIndex":1}},{"content":"","children":[{"content":"2. La vendita deve essere <strong>ALTAMENTE PROBABILE entro 12 mesi</strong>:","children":[],"payload":{"tag":"li","lines":"280,281","listIndex":2}},{"content":"","children":[{"content":"Il management appropriato ha formalmente approvato un piano vincolante di vendita;","children":[],"payload":{"tag":"li","lines":"281,282"}},{"content":"&#xc8; stato avviato un programma attivo per reperire acquirenti a un <strong>prezzo congruo</strong> rispetto al fair value corrente;","children":[],"payload":{"tag":"li","lines":"282,283"}},{"content":"La vendita si concluder&#xe0; presumibilmente entro 1 anno dalla data di classificazione;","children":[],"payload":{"tag":"li","lines":"283,284"}},{"content":"&#xc8; altamente improbabile che il piano venga revocato o modificato in modo significativo.","children":[],"payload":{"tag":"li","lines":"284,285"}}],"payload":{"tag":"ul","lines":"281,285"}}],"payload":{"tag":"li","lines":"280,285"}}],"payload":{"tag":"li","lines":"278,285"}}],"payload":{"tag":"li","lines":"276,285"}},{"content":"<strong>La Regola di Valutazione al Minor Valore (Quesito 07.3)</strong>","children":[{"content":"L&apos;attivit&#xe0; viene iscritta al:","children":[{"content":"<span class=\"katex-error\" title=\"\\mathbf{MINORE\\ tra:}\\ \begin{cases} \text{1. Valore Contabile Netto Precedente (Carrying Amount)} \\ \text{2. Fair Value al Netto dei Costi di Dismissione (Fair Value Less Costs to Sell)} \\end{cases}\">ParseError: KaTeX parse error: Unexpected character: &apos;\b&apos; at position 24: &#x2026;MINORE\\ tra:}\\ \b&#x332;egin{cases} \tex&#x2026;</span>","children":[],"payload":{"tag":"li","lines":"287,288"}}],"payload":{"tag":"li","lines":"286,288"}},{"content":"<strong>Esercizio Numerico Risolto (Quesito 07.3)</strong>: Macchinario con valore contabile precedente di &#x20ac;240.000. Fair Value corrente &#x20ac;230.000 e costi di vendita stimati &#x20ac;10.000:","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>F</mi><mi>a</mi><mi>i</mi><mi>r</mi><mi>V</mi><mi>a</mi><mi>l</mi><mi>u</mi><mi>e</mi><mi>N</mi><mi>e</mi><mi>t</mi><mi>t</mi><mi>o</mi></mrow><mo>=</mo><mn>230.000</mn><mo>&#x2212;</mo><mn>10.000</mn><mo>=</mo><mrow><mn mathvariant=\"bold\">220.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Fair Value Netto} = 230.000 - 10.000 = \\mathbf{220.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">F</span><span class=\"mord mathnormal\">ai</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\" style=\"margin-right:0.109em;\">N</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">tt</span><span class=\"mord mathnormal\">o</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">230.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">10.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">220.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span>;","children":[],"payload":{"tag":"li","lines":"289,290"}},{"content":"Nuovo valore iscritto nello SP: <strong>220.000 &#x20ac;</strong>;","children":[],"payload":{"tag":"li","lines":"290,291"}},{"content":"Si rileva una <strong>perdita per riduzione di valore (<em>Impairment Loss</em>) di 20.000 &#x20ac; a Conto Economico (P&amp;L)</strong>.","children":[],"payload":{"tag":"li","lines":"291,292"}}],"payload":{"tag":"li","lines":"288,292"}}],"payload":{"tag":"li","lines":"285,292"}},{"content":"<strong>Lo Stop Totale all&apos;Ammortamento (Quesito 07.2)</strong>","children":[{"content":"<strong>In quale momento cessa l&apos;ammortamento?</strong> L&apos;ammortamento si arresta <strong>ALLA DATA IN CUI SONO SODDISFATTE TUTTE LE CONDIZIONI DI CLASSIFICAZIONE</strong> (non alla sola approvazione del piano, n&#xe9; al momento del rogito o dell&apos;incasso!).","children":[],"payload":{"tag":"li","lines":"293,294"}},{"content":"<em>Perch&#xe9;?</em> Perch&#xe9; il cespite non si consuma pi&#xf9; operativamente; il suo valore &#xe8; gi&#xe0; allineato al valore netto di realizzo di mercato.","children":[],"payload":{"tag":"li","lines":"294,295"}}],"payload":{"tag":"li","lines":"292,295"}},{"content":"<strong>Presentazione nello Stato Patrimoniale</strong>","children":[{"content":"Il bene esce dalle Attivit&#xe0; Non Correnti ed entra in una riga separata nelle <strong>Attivit&#xe0; Correnti</strong>: <em>&quot;Attivit&#xe0; non correnti possedute per la vendita&quot;</em>.","children":[],"payload":{"tag":"li","lines":"296,297"}},{"content":"Eventuali debiti legati al cespite vanno in una riga separata nelle <strong>Passivit&#xe0; Correnti</strong> (<strong>divieto assoluto di compensazione</strong>).","children":[],"payload":{"tag":"li","lines":"297,298"}},{"content":"Lo Stato Patrimoniale dell&apos;anno precedente (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>&#x2212;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t-1</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6984em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span></span></span></span>) <strong>NON viene modificato retroattivamente</strong>.","children":[],"payload":{"tag":"li","lines":"298,299"}}],"payload":{"tag":"li","lines":"295,299"}},{"content":"<strong>Discontinued Operations (Attivit&#xe0; Operative Cessate - Quesito 07.4)</strong>","children":[{"content":"<strong>Definizione</strong>: &#xc8; una componente dell&apos;impresa gi&#xe0; dismessa o classificata come <em>held for sale</em> che rappresenta un <strong>importante ramo autonomo di attivit&#xe0; o un&apos;area geografica significativa</strong> (es. l&apos;intera divisione auto o tutte le filiali in Sud America).","children":[],"payload":{"tag":"li","lines":"300,301"}},{"content":"<strong>Presentazione nel Conto Economico</strong>:","children":[{"content":"Tutti i suoi ricavi, costi operativi e imposte vengono rimossi dalle ordinarie categorie del P&amp;L;","children":[],"payload":{"tag":"li","lines":"302,303"}},{"content":"Vengono esposti in un&apos;<strong>UNICA RIGA SINTETICA in fondo al Conto Economico al netto delle imposte</strong>: <em>&quot;Risultato netto delle attivit&#xe0; operative cessate (<em>Discontinued Operations</em>)&quot;</em>;","children":[],"payload":{"tag":"li","lines":"303,304"}},{"content":"Nelle Note al bilancio deve essere fornita la scomposizione analitica (ricavi, costi, plusvalenza/minusvalenza netta e imposte);","children":[],"payload":{"tag":"li","lines":"304,305"}},{"content":"Nel P&amp;L comparativo dell&apos;anno scorso (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>&#x2212;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">t-1</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6984em;vertical-align:-0.0833em;\"></span><span class=\"mord mathnormal\">t</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">1</span></span></span></span>) <strong>si rideterminano i dati retrospettivamente</strong> per isolare la riga discontinued e consentire il confronto omogeneo delle sole attivit&#xe0; in funzionamento (<em>Continuing Operations</em>).","children":[],"payload":{"tag":"li","lines":"305,306"}}],"payload":{"tag":"li","lines":"301,306"}}],"payload":{"tag":"li","lines":"299,306"}},{"content":"<strong>Mancata Vendita (<em>Changes to a Plan of Sale</em>)</strong>","children":[{"content":"Se le trattative falliscono o il management revoca il piano, il bene torna nelle Attivit&#xe0; Non Correnti.","children":[],"payload":{"tag":"li","lines":"307,308"}},{"content":"<strong>Valore di Reiscrizione</strong>: viene iscritto al <strong>MINORE tra</strong>:","children":[{"content":"1. Il valore contabile che avrebbe avuto se non fosse mai stato classificato in IFRS 5 (ovvero deducendo tutti gli ammortamenti e le svalutazioni che si sarebbero dovuti calcolare nel frattempo);","children":[],"payload":{"tag":"li","lines":"309,310","listIndex":1}},{"content":"2. Il Valore Recuperabile ex IAS 36 alla data di revoca.","children":[],"payload":{"tag":"li","lines":"310,311","listIndex":2}}],"payload":{"tag":"li","lines":"308,311"}},{"content":"La differenza viene imputata immediatamente a Conto Economico (P&amp;L) come rettifica di costo della gestione in funzionamento.","children":[],"payload":{"tag":"li","lines":"311,312"}}],"payload":{"tag":"li","lines":"306,312"}}],"payload":{"tag":"h2","lines":"275,276"}}],"payload":{"tag":"h1","lines":"7,8"}},{"colorFreezeLevel":2,"maxWidth":380})</script>
