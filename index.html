            })(() => window.markmap,null,{"content":"Principi Contabili Internazionali &#x2013; Modulo 1 (Guida Approfondita)","children":[{"content":"1. Conceptual Framework for Financial Reporting &amp; Capital Maintenance","children":[{"content":"<strong>Natura, Funzione e Gerarchia delle Fonti (IAS 8)</strong>","children":[{"content":"<strong>Cos&apos;&#xe8; il Conceptual Framework?</strong>","children":[{"content":"&#xc8; il documento teorico fondativo dello IASB (aggiornato nel 2018) che fissa i concetti, gli obiettivi e i principi cardine della contabilit&#xe0; internazionale.","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"<strong>Status Giuridico Formale</strong>: NON &#xe8; un principio contabile (IFRS o IAS) e NON ha forza di legge cogente. Di conseguenza, <strong>non prevale mai su alcun principio contabile specifico</strong>. Se una norma dello IAS 38 o dell&apos;IFRS 9 appare in contrasto con il Framework, il redattore deve applicare obbligatoriamente il principio.","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"li","lines":"11,14"}},{"content":"<strong>A cosa serve se non &#xe8; vincolante?</strong>","children":[{"content":"1. Guida lo standard setter (IASB) a scrivere principi contabili coerenti nel tempo, evitando regole arbitrarie o contraddittorie.","children":[],"payload":{"tag":"li","lines":"15,16","listIndex":1}},{"content":"2. Assiste revisori contabili e analisti nell&apos;interpretazione degli standard.","children":[],"payload":{"tag":"li","lines":"16,17","listIndex":2}},{"content":"3. <strong>La Gerarchia di IAS 8 per i Redattori</strong>: quando un&apos;impresa si trova di fronte a una transazione o evento non espressamente disciplinato da alcuno standard IFRS, il management non pu&#xf2; decidere a piacimento: deve applicare la gerarchia dello IAS 8. Questa impone di consultare prima gli IFRS che trattano casi simili e, subito dopo, le definizioni, i criteri di rilevazione e i concetti di misurazione del Conceptual Framework.","children":[],"payload":{"tag":"li","lines":"17,18","listIndex":3}}],"payload":{"tag":"li","lines":"14,18"}}],"payload":{"tag":"li","lines":"10,18"}},{"content":"<strong>Obiettivo del Bilancio e Destinatari Primari (Primary Users)</strong>","children":[{"content":"<strong>L&apos;Obiettivo: Utilit&#xe0; Decisionale (<em>Decision-Usefulness</em>)</strong>","children":[{"content":"La finalit&#xe0; del General Purpose Financial Reporting &#xe8; fornire informazioni economico-finanziarie sull&apos;entit&#xe0; che siano utili a soggetti esterni per assumere decisioni in merito alla fornitura di risorse all&apos;impresa (comprare o vendere azioni, concedere o revocare prestiti, votare sulla fiducia agli amministratori).","children":[],"payload":{"tag":"li","lines":"20,21"}}],"payload":{"tag":"li","lines":"19,21"}},{"content":"<strong>Chi sono i Destinatari Primari (<em>Primary Users</em>)?</strong>","children":[{"content":"Sono esclusivamente gli <strong>investitori</strong> (azionisti attuali e potenziali) e i <strong>finanziatori e altri creditori</strong> (banche, obbligazionisti, fornitori).","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"<strong>Perch&#xe9; il bilancio &#xe8; disegnato attorno a loro?</strong> Perch&#xe9;, a differenza del management interno o dell&apos;Agenzia delle Entrate (che possono ordinare per legge o contratto report personalizzati), gli investitori sul mercato non hanno il potere contrattuale di esigere report su misura e devono fare affidamento solo sul bilancio pubblico a destinazione generale.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Cosa cercano gli utenti? (Cash Flow Prospects)</strong>: Vogliono stimare l&apos;ammontare, la tempistica e il grado di incertezza dei <strong>futuri flussi di cassa netti</strong> che l&apos;impresa generer&#xe0;, per determinare il rendimento del proprio capitale.","children":[],"payload":{"tag":"li","lines":"24,25"}}],"payload":{"tag":"li","lines":"21,25"}},{"content":"<strong>Entity Perspective &amp; Going Concern</strong>","children":[{"content":"<strong>Entity Perspective (Prospettiva dell&apos;Entit&#xe0;)</strong>: Il bilancio &#xe8; redatto dal punto di vista dell&apos;impresa come soggetto economico autonomo e distinto dai suoi proprietari, non dal punto di vista personale di un singolo azionista o banca.","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<strong>Postulato di Continuit&#xe0; (<em>Going Concern Assumption</em>)</strong>: Il bilancio presuppone che l&apos;azienda continui a operare nel futuro prevedibile (almeno 12 mesi). Se c&apos;&#xe8; intenzione o necessit&#xe0; di liquidare, il bilancio va redatto a valori di realizzo/liquidazione.","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"li","lines":"25,28"}}],"payload":{"tag":"li","lines":"18,28"}},{"content":"<strong>Reporting Entity vs Legal Entity (Confini Economici del Bilancio)</strong>","children":[{"content":"<strong>Il Principio di Sostanza sulla Forma</strong>: La contabilit&#xe0; IFRS guarda alla sostanza economica e non alla forma giuridica (<em>substance over form</em>). Una <em>Reporting Entity</em> &#xe8; definita semplicemente come un&apos;entit&#xe0; che redige il bilancio, e <strong>non coincide necessariamente con una persona giuridica (Legal Entity)</strong>.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>I 4 Casi Operativi di Reporting Entity</strong>:","children":[{"content":"<strong>1. Reporting Entity &gt; Legal Entity: Il Bilancio Consolidato</strong>","children":[{"content":"Quando la reporting entity comprende una societ&#xe0; capogruppo e pi&#xf9; societ&#xe0; controllate giuridicamente autonome. Sul piano legale sono tante societ&#xe0; separate; sul piano economico agiscono come un solo organismo. Il bilancio consolidato abbatte i confini legali e somma riga per riga tutti gli asset e i debiti delle figlie.","children":[],"payload":{"tag":"li","lines":"32,33"}}],"payload":{"tag":"li","lines":"31,33"}},{"content":"<strong>2. Reporting Entity &lt; Legal Entity: Segment Reporting e Carve-out</strong>","children":[{"content":"Quando la reporting entity &#xe8; solo una divisione o ramo d&apos;affari interno a una grande persona giuridica (es. la divisione navale di una holding industriale, o un ramo venduto con un&apos;operazione di carve-out). Serve a mostrare ai mercati la redditivit&#xe0; specifica di quel singolo business.","children":[],"payload":{"tag":"li","lines":"34,35"}}],"payload":{"tag":"li","lines":"33,35"}},{"content":"<strong>3. Societ&#xe0; Sorelle sotto Controllo Comune: Il Bilancio Combinato</strong>","children":[{"content":"Quando due o pi&#xf9; societ&#xe0; operative sono sotto il controllo della stessa famiglia o dello stesso gruppo di soci (<em>Common Control</em>), ma non esiste una societ&#xe0; holding capogruppo a monte. Per mostrare il quadro complessivo a banche o investitori in vista di un&apos;IPO, si redige il Bilancio Combinato sommando i bilanci ed elidendo i rapporti infragruppo.","children":[],"payload":{"tag":"li","lines":"36,37"}}],"payload":{"tag":"li","lines":"35,37"}},{"content":"<strong>4. Bilancio Non Consolidato (Separato della Sola Madre)</strong>","children":[{"content":"La reporting entity coincide rigorosamente con la sola capogruppo. Le societ&#xe0; controllate rimangono all&apos;esterno: i loro capannoni e debiti non entrano nello SP, ma figurano come un&apos;unica voce nell&apos;attivo finanziario: <strong>&quot;Partecipazioni in controllate&quot;</strong> valutata ex IAS 27 (al costo, al fair value ex IFRS 9 o a patrimonio netto). Serve a misurare la solvibilit&#xe0; diretta della madre e la sua capacit&#xe0; di distribuire dividendi propri.","children":[],"payload":{"tag":"li","lines":"38,39"}}],"payload":{"tag":"li","lines":"37,39"}}],"payload":{"tag":"li","lines":"30,39"}},{"content":"<strong>La Regola dei Confini (<em>Boundaries</em>) e Divieto di Cherry-Picking</strong>:","children":[{"content":"Tracciare i confini della reporting entity non &#xe8; arbitrario: &#xe8; severamente vietato selezionare ad arte solo le societ&#xe0; o attivit&#xe0; in attivo ed escludere quelle indebitate o in perdita (<em>cherry-picking</em>).","children":[],"payload":{"tag":"li","lines":"40,41"}}],"payload":{"tag":"li","lines":"39,41"}}],"payload":{"tag":"li","lines":"28,41"}},{"content":"<strong>Caratteristiche Qualitative Fondamentali (Rendono l&apos;informazione utile)</strong>","children":[{"content":"<strong>1. Significativit&#xe0; (<em>Relevance</em>)</strong>","children":[{"content":"Un&apos;informazione &#xe8; significativa se &#xe8; capace di influenzare il processo decisionale degli utilizzatori. Ha <strong>valore predittivo</strong> (aiuta a formulare previsioni su flussi futuri) e/o <strong>valore confermativo</strong> (fornisce un riscontro per confermare o correggere valutazioni precedenti).","children":[],"payload":{"tag":"li","lines":"43,44"}}],"payload":{"tag":"li","lines":"42,44"}},{"content":"<strong>La Rilevanza (<em>Materiality</em>)</strong>","children":[{"content":"&#xc8; la declinazione specifica della significativit&#xe0; per la singola entit&#xe0;: un&apos;informazione &#xe8; rilevante (<em>material</em>) se la sua omissione, errata indicazione o oscuramento potrebbe ragionevolmente condizionare le decisioni degli utenti.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"<strong>Dimensione Quantitativa</strong>: Riguarda la grandezza monetaria. La regola aurea spiegata a lezione considera rilevante qualsiasi errore o scostamento <strong>pari o superiore al 5% nella stima dell&apos;utile d&apos;esercizio</strong>.","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Dimensione Qualitativa</strong>: Riguarda la natura intrinseca dell&apos;operazione. Ci sono eventi rilevanti anche se monetariamente piccolissimi:","children":[{"content":"1. Errori che causano un&apos;<strong>inversione di tendenza</strong> (trasformano un utile netto in perdita d&apos;esercizio);","children":[],"payload":{"tag":"li","lines":"48,49","listIndex":1}},{"content":"2. Violazione di <strong>covenants bancari</strong> o vincoli regolamentari (che farebbero decadere i finanziamenti);","children":[],"payload":{"tag":"li","lines":"49,50","listIndex":2}},{"content":"3. Transazioni con <strong>parti correlate</strong> (compensi o accordi con amministratori/azionisti con potenziali conflitti d&apos;interesse).","children":[],"payload":{"tag":"li","lines":"50,51","listIndex":3}}],"payload":{"tag":"li","lines":"47,51"}},{"content":"<strong>Il Processo in 4 Fasi della Rilevanza (Practice Statement 2)</strong>:","children":[{"content":"<em>Passo 1 (Identify)</em>: Individuare le informazioni potenzialmente rilevanti dai principi e dal contesto;","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<em>Passo 2 (Assess)</em>: Valutare l&apos;impatto applicando sia il filtro quantitativo (soglia 5%) sia il filtro qualitativo;","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<em>Passo 3 (Organise)</em>: Organizzare la bozza di bilancio aggregando voci simili ed <strong>evitando l&apos;oscuramento (<em>anti-obscuring</em>)</strong>;","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"<em>Passo 4 (Review)</em>: Esaminare il bilancio nel suo complesso per verificare l&apos;equilibrio complessivo dell&apos;informativa.","children":[],"payload":{"tag":"li","lines":"55,56"}}],"payload":{"tag":"li","lines":"51,56"}}],"payload":{"tag":"li","lines":"44,56"}},{"content":"<strong>2. Rappresentazione Fedele (<em>Faithful Representation</em>)</strong>","children":[{"content":"Il bilancio deve rappresentare la sostanza economica dei fenomeni e non la sola veste giuridica (<em>substance over form</em>).","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"Si articola in tre requisiti inderogabili:","children":[{"content":"<strong>Completezza (<em>Complete</em>)</strong>: include tutte le descrizioni e spiegazioni necessarie a comprendere il fenomeno;","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"<strong>Assenza di Errori (<em>Free from error</em>)</strong>: non significa precisione scientifica assoluta (le stime contengono soggettivit&#xe0;), ma che il processo di calcolo &#xe8; stato condotto senza errori procedurali ed esplicitando le ipotesi;","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"<strong>Neutralit&#xe0; (<em>Neutral</em>)</strong>: l&apos;informazione &#xe8; priva di pregiudizi, non &#xe8; manipolata, filtrata o enfatizzata per indurre un predeterminato comportamento negli utenti.","children":[],"payload":{"tag":"li","lines":"61,62"}}],"payload":{"tag":"li","lines":"58,62"}}],"payload":{"tag":"li","lines":"56,62"}},{"content":"<strong>Prudenza Cautelativa vs Prudenza Asimmetrica del Codice Civile</strong>","children":[{"content":"<strong>Cosa intende lo IASB per Prudenza? (Cautious Prudence)</strong>: &#xc8; l&apos;esercizio di cautela nelle stime in condizioni di incertezza, affinch&#xe9; le attivit&#xe0; e i ricavi non siano sovrastimati e le passivit&#xe0; e i costi non siano sottostimati.","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"<strong>Perch&#xe9; lo IASB VIETA la Prudenza Asimmetrica?</strong>","children":[{"content":"Nel Codice Civile italiano vale l&apos;asimmetria sistematica: le perdite si rilevano anche se solo temute, mentre gli utili si rilevano solo se certi/realizzati.","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"Negli IFRS la prudenza asimmetrica e le riserve occulte sono <strong>severamente vietate</strong>: sottostimare deliberatamente un impianto oggi (iscrivendo ammortamenti eccessivi o perdite inesistenti) deprime il risultato di quest&apos;anno, ma fa s&#xec; che negli anni futuri gli ammortamenti saranno artificialmente pi&#xf9; bassi, <strong>gonfiando i margini di domani</strong>. Questo viola la neutralit&#xe0; e produce una rappresentazione non fedele nel tempo.","children":[],"payload":{"tag":"li","lines":"66,67"}}],"payload":{"tag":"li","lines":"64,67"}}],"payload":{"tag":"li","lines":"62,67"}}],"payload":{"tag":"li","lines":"41,67"}},{"content":"<strong>Caratteristiche Qualitative di Potenziamento (<em>Enhancing Characteristics</em>)</strong>","children":[{"content":"Hanno il compito di incrementare l&apos;utilit&#xe0; di un&apos;informazione che &#xe8; gi&#xe0; significativa e fedele (non possono rendere utile un&apos;informazione falsa o irrilevante):","children":[{"content":"<strong>Comparabilit&#xe0;</strong>: Permette di cogliere somiglianze e differenze nel tempo (costanza di criteri nella stessa impresa) e nello spazio (tra imprese dello stesso settore). Non impone uniformit&#xe0; cieca: transazioni diverse devono essere contabilizzate diversamente.","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Verificabilit&#xe0;</strong>: Assicura che osservatori esperti e indipendenti possano raggiungere il medesimo consenso sulla fedelt&#xe0; della stima. Pu&#xf2; essere diretta (conteggio cassa/scorte) o indiretta (verifica di formule, tassi di sconto e modelli finanziari).","children":[],"payload":{"tag":"li","lines":"70,71"}},{"content":"<strong>Tempestivit&#xe0;</strong>: Informazione resa disponibile in tempo utile per orientare le decisioni prima che perdano efficacia.","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"<strong>Comprensibilit&#xe0;</strong>: Informazioni classificate ed esposte con chiarezza e concisione. Si presuppone che i destinatari posseggano una ragionevole conoscenza delle dinamiche aziendali e studino i bilanci con ragionevole diligenza.","children":[],"payload":{"tag":"li","lines":"72,73"}},{"content":"<strong>Vincolo del Costo (<em>Cost Constraint</em>)</strong>: I benefici generati dall&apos;informazione contabile per gli investitori devono sempre superare i costi sostenuti dall&apos;impresa per produrla e auditarla.","children":[],"payload":{"tag":"li","lines":"73,74"}}],"payload":{"tag":"li","lines":"68,74"}}],"payload":{"tag":"li","lines":"67,74"}},{"content":"<strong>Elementi del Bilancio e Nuove Definizioni (2018)</strong>","children":[{"content":"<strong>Attivit&#xe0; (<em>Asset</em>)</strong>: Una risorsa economica presente controllata dall&apos;entit&#xe0; come risultato di eventi passati. Una risorsa economica &#xe8; un <strong>diritto</strong> che ha il <strong>potenziale di produrre benefici economici</strong> (non si richiede pi&#xf9; la certezza del flusso futuro, basta il potenziale).","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<strong>Passivit&#xe0; (<em>Liability</em>)</strong>: Un&apos;obbligazione attuale dell&apos;entit&#xe0; al trasferimento di una risorsa economica derivante da eventi passati, per la quale l&apos;impresa <strong>non ha la capacit&#xe0; pratica di evitare il trasferimento (<em>no practical ability to avoid</em>)</strong>.","children":[],"payload":{"tag":"li","lines":"76,77"}},{"content":"<strong>Patrimonio Netto (<em>Equity</em>)</strong>: La grandezza residuale che scaturisce dalla differenza algebrica tra Attivit&#xe0; e Passivit&#xe0; (Attivo Netto).","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"<strong>Ricavi (<em>Income</em>) &amp; Costi (<em>Expenses</em>)</strong>: Incrementi o decrementi di attivit&#xe0; e passivit&#xe0; che generano variazioni nel patrimonio netto, diverse da apporti di capitale o distribuzioni ai soci.","children":[],"payload":{"tag":"li","lines":"78,79"}}],"payload":{"tag":"li","lines":"74,79"}},{"content":"<strong>Misurazione: Costo Storico vs Valori Correnti</strong>","children":[{"content":"<strong>Costo Storico (<em>Historical Cost</em>)</strong>: Misura l&apos;attivit&#xe0; al valore della transazione originaria (prezzo d&apos;acquisto + costi di transazione). Non riflette rivalutazioni di mercato nel tempo, tranne ammortamenti e svalutazioni da impairment.","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"<strong>Valori Correnti (<em>Current Value</em>)</strong>:","children":[{"content":"<strong>Fair Value (IFRS 13)</strong>: Prezzo di mercato di uscita che si percepirebbe vendendo l&apos;asset in una transazione ordinaria tra operatori indipendenti. &#xc8; un valore oggettivo orientato al mercato (<em>market-based</em>), non legato all&apos;uso specifico che l&apos;impresa fa del bene (<em>not entity-specific</em>).","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"<strong>Valore d&apos;Uso (<em>Value in Use</em> - IAS 36)</strong>: Valore attuale dei flussi di cassa stimati che l&apos;azienda prevede di ottenere dall&apos;uso continuativo del bene e dalla sua dismissione finale. &#xc8; un valore soggettivo e specifico dell&apos;impresa (<em>entity-specific</em>).","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"<strong>Costo Corrente (<em>Current Cost</em>)</strong>: Costo di sostituzione che l&apos;azienda sosterrebbe oggi per acquistare un bene equivalente.","children":[],"payload":{"tag":"li","lines":"84,85"}}],"payload":{"tag":"li","lines":"81,85"}}],"payload":{"tag":"li","lines":"79,85"}},{"content":"<strong>Mantenimento del Capitale (<em>Capital Maintenance</em> - Focus Modulo 05)</strong>","children":[{"content":"<strong>L&apos;Assioma Fondamentale</strong>: L&apos;impresa genera un profitto (utile) <strong>SOLO ed esclusivamente dopo che il proprio capitale iniziale &#xe8; stato mantenuto intatto</strong>. Qualsiasi eccedenza &#xe8; profitto; qualsiasi valore al di sotto rappresenta un&apos;erosione patrimoniale.","children":[],"payload":{"tag":"li","lines":"86,87"}},{"content":"<strong>La Formula d&apos;Esame del Profitto</strong>:","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">f</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">o</mi><mo>=</mo><mi mathvariant=\"bold\">&#x394;</mi><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">N</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">o</mi><mo>&#x2212;</mo><mi mathvariant=\"bold\">A</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">S</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">c</mi><mi mathvariant=\"bold\">i</mi><mo>+</mo><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">b</mi><mi mathvariant=\"bold\">u</mi><mi mathvariant=\"bold\">z</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">d</mi><mi mathvariant=\"bold\">i</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{Profitto = \\Delta Patrimonio\\ Netto - Apporti\\ dei\\ Soci + Distribuzioni\\ di\\ Dividendi}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">Profitto</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mord mathbf\">&#x394;Patrimonio</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Netto</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord mathbf\">Apporti</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">dei</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Soci</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord mathbf\">Distribuzioni</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">di</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Dividendi</span></span></span></span></span>","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"<strong>Perch&#xe9; gli apporti dei soci non sono profitto? (Quesito 05.1)</strong>: Perch&#xe9; le transazioni a titolo di capitale tra l&apos;impresa e i suoi proprietari devono essere escluse dal reddito dell&apos;esercizio.","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"<strong>Esercizio Numerico Risolto (Quesito 05.3)</strong>: PN iniziale &#x20ac;150.000, PN finale &#x20ac;185.000 (<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">&#x394;</mi><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>P</mi><mi>N</mi></mrow><mo>=</mo><mo>+</mo><mn>35.000</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta\text{PN} = +35.000</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6833em;\"></span><span class=\"mord\">&#x394;</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\" style=\"margin-right:0.109em;\">N</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">+</span><span class=\"mord\">35.000</span></span></span></span> &#x20ac;). Soci apportano &#x20ac;40.000 e ricevono dividendi per &#x20ac;15.000.<br>\n<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>P</mi><mi>r</mi><mi>o</mi><mi>f</mi><mi>i</mi><mi>t</mi><mi>t</mi><mi>o</mi></mrow><mo>=</mo><mn>35.000</mn><mo>&#x2212;</mo><mn>40.000</mn><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mo stretchy=\"false\">(</mo><mi>a</mi><mi>p</mi><mi>p</mi><mi>o</mi><mi>r</mi><mi>t</mi><mi>i</mi><mo stretchy=\"false\">)</mo></mrow><mo>+</mo><mn>15.000</mn><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mo stretchy=\"false\">(</mo><mi>d</mi><mi>i</mi><mi>v</mi><mi>i</mi><mi>d</mi><mi>e</mi><mi>n</mi><mi>d</mi><mi>i</mi><mo stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mn mathvariant=\"bold\">10.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Profitto} = 35.000 - 40.000\text{ (apporti)} + 15.000\text{ (dividendi)} = \\mathbf{10.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.1076em;\">f</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">tt</span><span class=\"mord mathnormal\">o</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">35.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">40.000</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mopen\">(</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\">pp</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">i</span><span class=\"mclose\">)</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\">15.000</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mopen\">(</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">i</span><span class=\"mclose\">)</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">10.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"90,92"}}],"payload":{"tag":"li","lines":"87,92"}},{"content":"<strong>I Tre Modelli di Capitale a Confronto (Quesito 05.2)</strong>:","children":[{"content":"<strong>1. Capitale Finanziario Nominale</strong>: Definisce il capitale in termini di euro nominali investiti. Il capitale &#xe8; mantenuto se il PN finale supera quello iniziale a moneta storica. Ignora completamente l&apos;inflazione (adottato dal modello a costo storico tradizionale).","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"<strong>2. Capitale Finanziario Reale</strong>: Definisce il capitale in termini di <strong>potere d&apos;acquisto</strong>. C&apos;&#xe8; profitto solo se il PN finale supera il capitale iniziale rettificato per l&apos;inflazione (indice generale dei prezzi ex IAS 29).","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"<strong>3. Capitale Fisico</strong>: Definisce il capitale in termini di <strong>capacit&#xe0; operativa e produttiva</strong> (tonnellate prodotte, impianti in efficienza). Si valuta a costi correnti di sostituzione: gli aumenti di valore dei macchinari dovuti a rincari di mercato non sono considerati utili d&apos;esercizio distribuibili, ma sono riserve di mantenimento del capitale fisico iscritte a patrimonio netto.","children":[],"payload":{"tag":"li","lines":"95,97"}}],"payload":{"tag":"li","lines":"92,97"}}],"payload":{"tag":"li","lines":"85,97"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"2. IAS 1 &#x2013; Presentazione del Bilancio","children":[{"content":"<strong>Set Completo del Bilancio e Regole di Vigenza</strong>","children":[{"content":"<strong>La Regola di Vigenza Temporale (Quesito 01.1)</strong>: Una societ&#xe0; che redige il bilancio per l&apos;esercizio 2026 e non adotta anticipatamente IFRS 18 applica obbligatoriamente <strong>IAS 1</strong>, poich&#xe9; IFRS 18 entra formalmente in vigore solo dal 1&#xb0; gennaio 2027.","children":[],"payload":{"tag":"li","lines":"99,100"}},{"content":"<strong>I Documenti Obbligatori</strong>: 1. Stato Patrimoniale; 2. Conto Economico e OCI; 3. Prospetto delle Variazioni di Patrimonio Netto; 4. Rendiconto Finanziario (IAS 7); 5. Note al Bilancio; 6. Terzo SP iniziale in caso di applicazione retrospettiva di principi (IAS 8).","children":[],"payload":{"tag":"li","lines":"100,101"}}],"payload":{"tag":"li","lines":"98,101"}},{"content":"<strong>Postulati Generali di Redazione</strong>","children":[{"content":"<strong>Competenza Economica (<em>Accrual Basis</em>)</strong>: Gli effetti delle transazioni si rilevano nel periodo in cui maturano e non quando si manifesta l&apos;incasso o il pagamento. Vale per tutti i prospetti con l&apos;unica eccezione del Rendiconto Finanziario (IAS 7).","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"<strong>Divieto Assoluto di Compensazione (<em>No Offsetting</em>)</strong>: Attivit&#xe0; e passivit&#xe0;, cos&#xec; come ricavi e costi, non possono essere compensati tra loro salvo espressa previsione contabile.","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"<strong>Divieto Categorico di Componenti Straordinari</strong>: &#xc8; fatto espresso divieto di qualificare voci come &quot;straordinarie&quot; sia nel Conto Economico sia nelle Note.","children":[],"payload":{"tag":"li","lines":"104,105"}}],"payload":{"tag":"li","lines":"101,105"}},{"content":"<strong>Stato Patrimoniale: Corrente vs Non Corrente</strong>","children":[{"content":"La classificazione ordinaria obbligatoria &#xe8; basata sulla separazione Corrente / Non Corrente (il criterio di liquidit&#xe0; decrescente &#xe8; riservato agli intermediari finanziari).","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"<strong>Criteri Attivit&#xe0; Correnti</strong>:","children":[{"content":"1. Realizzo, vendita o consumo nel <strong>normale ciclo operativo</strong> dell&apos;impresa (anche se dura pi&#xf9; di 12 mesi!);","children":[],"payload":{"tag":"li","lines":"108,109","listIndex":1}},{"content":"2. Posseduta principalmente per finalit&#xe0; di negoziazione (<em>trading</em>);","children":[],"payload":{"tag":"li","lines":"109,110","listIndex":2}},{"content":"3. Realizzo previsto entro <strong>12 mesi</strong> dalla data di chiusura;","children":[],"payload":{"tag":"li","lines":"110,111","listIndex":3}},{"content":"4. Cassa o disponibilit&#xe0; liquide prive di vincoli di utilizzo per almeno 12 mesi.","children":[],"payload":{"tag":"li","lines":"111,112","listIndex":4}}],"payload":{"tag":"li","lines":"107,112"}},{"content":"<strong>Criteri Passivit&#xe0; Correnti</strong>: estinzione nel normale ciclo operativo, finalit&#xe0; di trading, scadenza entro 12 mesi, assenza di diritto incondizionato a differire per almeno 12 mesi.","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"<strong>Il Caso del Ciclo Operativo Pluriennale</strong>: Settori come cantieristica navale (costruzione navi in 36 mesi), agroalimentare di pregio (Parmigiano Reggiano stagionato 36 mesi o vini d&apos;annata affinati 4 anni) o edilizia su commessa mantengono crediti commerciali e scorte tra le <strong>Attivit&#xe0; Correnti</strong>, con obbligo di specificare in nota la quota realizzabile oltre l&apos;anno.","children":[],"payload":{"tag":"li","lines":"113,114"}},{"content":"<strong>Il Trabocchetto del Rifinanziamento (Quesito 01.2)</strong>:","children":[{"content":"<em>Scenario</em>: Al 31 dicembre un debito scade a 9 mesi. A febbraio dell&apos;anno successivo, prima che il CdA approvi il bilancio, l&apos;azienda firma con la banca il rifinanziamento a lungo termine a 5 anni.","children":[],"payload":{"tag":"li","lines":"115,116"}},{"content":"<em>Regola</em>: <strong>Al 31 dicembre il debito RESTA CORRENTE</strong>, perch&#xe9; alla data di riferimento del bilancio mancava il diritto contrattuale a differire il pagamento. L&apos;accordo di febbraio &#xe8; un evento successivo non-adjusting (IAS 10): va data disclosure in nota ma non si tocca la classificazione nello SP!","children":[],"payload":{"tag":"li","lines":"116,117"}}],"payload":{"tag":"li","lines":"114,117"}},{"content":"<strong>Current Ratio</strong>: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>A</mi><mi>t</mi><mi>t</mi><mi>i</mi><mi>v</mi><mi>i</mi><mi>t</mi><mover accent=\"true\"><mi>a</mi><mo>&#x2cb;</mo></mover><mi>C</mi><mi>o</mi><mi>r</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>t</mi><mi>i</mi></mrow><mi mathvariant=\"normal\">/</mi><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>P</mi><mi>a</mi><mi>s</mi><mi>s</mi><mi>i</mi><mi>v</mi><mi>i</mi><mi>t</mi><mover accent=\"true\"><mi>a</mi><mo>&#x2cb;</mo></mover><mi>C</mi><mi>o</mi><mi>r</mi><mi>r</mi><mi>e</mi><mi>n</mi><mi>t</mi><mi>i</mi></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Attivit&#xe0; Correnti} / \text{Passivit&#xe0; Correnti}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\">A</span><span class=\"mord mathnormal\">tt</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">t</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord mathnormal\">a</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">&#x2cb;</span></span></span></span></span></span></span><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">i</span></span><span class=\"mord\">/</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\">ss</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">v</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">t</span><span class=\"mord accent\"><span class=\"vlist-t\"><span class=\"vlist-r\"><span class=\"vlist\" style=\"height:0.6944em;\"><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"mord mathnormal\">a</span></span><span style=\"top:-3em;\"><span class=\"pstrut\" style=\"height:3em;\"></span><span class=\"accent-body\" style=\"left:-0.25em;\"><span class=\"mord\">&#x2cb;</span></span></span></span></span></span></span><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">i</span></span></span></span></span>. Misura la capacit&#xe0; di far fronte ai debiti a breve termine con le attivit&#xe0; a breve.","children":[],"payload":{"tag":"li","lines":"117,118"}}],"payload":{"tag":"li","lines":"105,118"}},{"content":"<strong>Performance Economica: Total Comprehensive Income (TCI)</strong>","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">T</mi><mi mathvariant=\"bold\">C</mi><mi mathvariant=\"bold\">I</mi><mo>=</mo><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">f</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">t</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">r</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">L</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">s</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">&amp;</mi><mi mathvariant=\"bold\">L</mi><mo stretchy=\"false\">)</mo><mo>+</mo><mi mathvariant=\"bold\">O</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">h</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">r</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">C</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">p</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">h</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">I</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">c</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">m</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">O</mi><mi mathvariant=\"bold\">C</mi><mi mathvariant=\"bold\">I</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathbf{TCI = Profit\\ or\\ Loss\\ (P\\&amp;L) + Other\\ Comprehensive\\ Income\\ (OCI)}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">TCI</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mord mathbf\">Profit</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">or</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Loss</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">P&amp;L</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">+</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mord mathbf\">Other</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Comprehensive</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Income</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">OCI</span><span class=\"mclose\">)</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"119,120"}},{"content":"<strong>Profit or Loss (P&amp;L)</strong>: Misura la redditivit&#xe0; operativa e realizzata dell&apos;esercizio; &#xe8; il dato fondamentale su cui si calcolano dividendi, EPS (IAS 33) e bonus del management.","children":[],"payload":{"tag":"li","lines":"120,121"}},{"content":"<strong>Other Comprehensive Income (OCI)</strong>: Accoglie variazioni di valore non realizzate (variazioni di fair value) prescritte da specifici standard per evitare che la volatilit&#xe0; di mercato inquini il P&amp;L.","children":[],"payload":{"tag":"li","lines":"121,122"}},{"content":"<strong>Effetto della Rivalutazione di Immobili (Quesito 01.3)</strong>: L&apos;incremento da rivalutazione di un immobile iscritto a OCI <strong>aumenta il Risultato Complessivo (TCI) e il Patrimonio Netto, ma NON aumenta l&apos;utile d&apos;esercizio (P&amp;L)</strong>.","children":[],"payload":{"tag":"li","lines":"122,123"}}],"payload":{"tag":"li","lines":"118,123"}},{"content":"<strong>La Disciplina del Recycling (Rettifiche da Riclassificazione)</strong>","children":[{"content":"Il recycling &#xe8; lo storno da OCI e l&apos;imputazione a P&amp;L di riserve temporanee quando l&apos;operazione giunge a compimento economico, evitando doppi conteggi nel TCI:","children":[{"content":"<strong>Voci CON Recycling</strong>: Titoli di debito FVOCI (IFRS 9), riserva Cash Flow Hedge sulle coperture efficaci, riserva di conversione cambi su societ&#xe0; estere (IAS 21). Alla vendita del titolo o chiusura della copertura, la riserva OCI confluisce a P&amp;L.","children":[],"payload":{"tag":"li","lines":"125,126"}},{"content":"<strong>Voci SENZA Recycling</strong>:","children":[{"content":"<strong>Rivalutazione di Immobili, Impianti e Macchinari (IAS 16 e IAS 38)</strong>: alla vendita dell&apos;immobile rivalutato, la riserva OCI residua <strong>non transita mai per il P&amp;L</strong>, ma viene girata direttamente a <em>Utili portati a nuovo</em> a patrimonio netto per impedire al management di vendere beni nei momenti di crisi per manipolare il reddito (<em>cherry-picking</em>);","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"Azioni e strumenti di capitale designati a FVOCI (IFRS 9);","children":[],"payload":{"tag":"li","lines":"128,129"}},{"content":"Utili e perdite attuariali sui fondi pensione e TFR (IAS 19).","children":[],"payload":{"tag":"li","lines":"129,130"}}],"payload":{"tag":"li","lines":"126,130"}}],"payload":{"tag":"li","lines":"124,130"}}],"payload":{"tag":"li","lines":"123,130"}},{"content":"<strong>Classificazione dei Costi Operativi a P&amp;L</strong>","children":[{"content":"<strong>Per Natura</strong>: aggrega i costi in base alla loro origine (materie prime, personale, ammortamenti). Pi&#xf9; semplice e oggettivo.","children":[],"payload":{"tag":"li","lines":"131,132"}},{"content":"<strong>Per Destinazione (o Funzione)</strong>: aggrega i costi per funzione aziendale (Costo del venduto, spese commerciali, spese amministrative). Evidenzia il Gross Margin.","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"<strong>Il Vincolo Informativo dello IAS 1</strong>: Se l&apos;azienda sceglie il metodo per destinazione, ha l&apos;<strong>obbligo vincolante di riportare nelle note al bilancio il dettaglio per natura dei costi del personale e degli ammortamenti</strong>, indispensabili per gli analisti finanziari.","children":[],"payload":{"tag":"li","lines":"133,135"}}],"payload":{"tag":"li","lines":"130,135"}}],"payload":{"tag":"h2","lines":"97,98"}},{"content":"3. IFRS 18 &#x2013; Nuova Presentazione e Disclosure (In vigore dal 2027)","children":[{"content":"<strong>Motivi della Riforma e Superamento dello IAS 1</strong>","children":[{"content":"Lo IASB ha emesso l&apos;IFRS 18 ad aprile 2024 per sostituire lo IAS 1 dal 1&#xb0; gennaio 2027.","children":[],"payload":{"tag":"li","lines":"137,138"}},{"content":"<strong>Il Problema Risolto</strong>: Nello IAS 1 non esisteva una definizione obbligatoria di Utile Operativo (EBIT); ciascuna azienda definiva i subtotali a proprio piacimento, rendendo impossibili i confronti tra concorrenti. Inoltre, il management diffondeva misure non-GAAP prive di disciplina.","children":[],"payload":{"tag":"li","lines":"138,139"}}],"payload":{"tag":"li","lines":"136,139"}},{"content":"<strong>Le 3 Categorie Rigide del Conto Economico</strong>","children":[{"content":"<strong>1. Categoria Operativa (<em>Operating Category</em>)</strong>:","children":[{"content":"Include tutti i ricavi e costi derivanti dalle attivit&#xe0; operative primarie dell&apos;impresa.","children":[],"payload":{"tag":"li","lines":"141,142"}},{"content":"<strong>LA REGOLA DELLA CATEGORIA RESIDUALE</strong>: &#xc8; definita come una categoria residuale: accoglie qualsiasi voce che non soddisfi la definizione di Investing, Financing, Imposte (IAS 12) o Discontinued Operations (IFRS 5). Di conseguenza, i costi di ristrutturazione aziendale, le sanzioni o i contenziosi operativi insoliti <strong>ricadono obbligatoriamente nell&apos;Operating Profit</strong>.","children":[],"payload":{"tag":"li","lines":"142,143"}}],"payload":{"tag":"li","lines":"140,143"}},{"content":"<strong>2. Categoria di Investimento (<em>Investing Category</em>)</strong>:","children":[{"content":"Accoglie ricavi e costi generati da attivit&#xe0; che producono un <strong>rendimento finanziario in modo del tutto indipendente</strong> dalle altre risorse operative:","children":[{"content":"Canoni di locazione e plusvalenze da investimenti immobiliari (IAS 40);","children":[],"payload":{"tag":"li","lines":"145,146"}},{"content":"Dividendi e interessi attivi da titoli finanziari detenuti a scopo di investimento;","children":[],"payload":{"tag":"li","lines":"146,147"}},{"content":"Quota di utili/perdite di societ&#xe0; collegate e Joint Venture valutate con il metodo del patrimonio netto (IAS 28).","children":[],"payload":{"tag":"li","lines":"147,148"}}],"payload":{"tag":"li","lines":"144,148"}}],"payload":{"tag":"li","lines":"143,148"}},{"content":"<strong>3. Categoria di Finanziamento (<em>Financing Category</em>)</strong>:","children":[{"content":"Comprende tutti i proventi e oneri legati a passivit&#xe0; derivanti dalla <strong>raccolta di capitali</strong> (interessi passivi su mutui bancari, prestiti obbligazionari, passivit&#xe0; per leasing IFRS 16) e gli effetti di attualizzazione finanziaria.","children":[],"payload":{"tag":"li","lines":"149,150"}}],"payload":{"tag":"li","lines":"148,150"}}],"payload":{"tag":"li","lines":"139,150"}},{"content":"<strong>I 2 Nuovi Subtotali Obbligatori (Quesito 01.4)</strong>","children":[{"content":"<strong>Risultato Operativo (<em>Operating Profit / EBIT standardizzato</em>)</strong>","children":[],"payload":{"tag":"li","lines":"151,152"}},{"content":"<strong>Utile prima dei Finanziamenti e delle Imposte (<em>Profit before financing and income taxes</em>)</strong>","children":[],"payload":{"tag":"li","lines":"152,153"}},{"content":"<strong>La loro Funzione Cruciale</strong>: Offrire punti di riferimento oggettivi, standardizzati e uniformi per confrontare societ&#xe0; che comunicano indicatori alternativi (<em>EBITDA rettificati</em>) calcolati con esclusioni diverse e arbitrarie.","children":[],"payload":{"tag":"li","lines":"153,154"}}],"payload":{"tag":"li","lines":"150,154"}},{"content":"<strong>La Disciplina delle MPMs (<em>Management Performance Measures</em>)</strong>","children":[{"content":"Sono subtotali di ricavi e costi definiti dal management per comunicare la performance agli analisti (es. <em>Adjusted EBITDA</em> o <em>Core Operating Profit</em>).","children":[],"payload":{"tag":"li","lines":"155,156"}},{"content":"<strong>La Nuova Regola IFRS 18</strong>: Se il management utilizza pubblicamente tali metriche, esse <strong>devono entrare ufficialmente nelle Note al bilancio</strong> in una nota dedicata.","children":[],"payload":{"tag":"li","lines":"156,157"}},{"content":"<strong>Obblighi Informativi in Nota</strong>: spiegazione del perch&#xe9; la misura &#xe8; utile, metodo di calcolo, <strong>tabella di riconciliazione analitica</strong> tra l&apos;MPM e il subtotale IFRS 18 pi&#xf9; vicino, impatto fiscale e quota di pertinenza dei soci terzi (<em>NCI</em>). La nota &#xe8; <strong>soggetta a revisione contabile obbligatoria (Audit)</strong>.","children":[],"payload":{"tag":"li","lines":"157,158"}}],"payload":{"tag":"li","lines":"154,158"}},{"content":"<strong>Regole di Aggregazione e Disaggregazione</strong>","children":[{"content":"Criteri rigidi per impedire l&apos;oscuramento: vietato raggruppare voci che hanno natura o funzione dissimile; divieto di usare etichette opache e generiche (&quot;Altro&quot; o &quot;Spese varie&quot;) senza disaggregazione nelle note.","children":[],"payload":{"tag":"li","lines":"159,161"}}],"payload":{"tag":"li","lines":"158,161"}}],"payload":{"tag":"h2","lines":"135,136"}},{"content":"4. IAS 7 &#x2013; Rendiconto Finanziario","children":[{"content":"<strong>La Filosofia &quot;Cash is King&quot; e il Principio di Cassa</strong>","children":[{"content":"&#xc8; l&apos;<strong>unico documento del bilancio redatto secondo il principio di cassa (<em>Cash Basis</em>)</strong> anzich&#xe9; di competenza economica.","children":[],"payload":{"tag":"li","lines":"163,164"}},{"content":"La redditivit&#xe0; a conto economico &#xe8; condizionata da stime, politiche di bilancio e congetture (un&apos;azienda con ottimi utili contabili pu&#xf2; fallire per insolvenza). Il rendiconto finanziario misura la liquidit&#xe0; monetaria reale generata o assorbita dalla gestione.","children":[],"payload":{"tag":"li","lines":"164,165"}}],"payload":{"tag":"li","lines":"162,165"}},{"content":"<strong>L&apos;Oggetto del Rendiconto: Cash and Cash Equivalents</strong>","children":[{"content":"<strong>Cash (Disponibilit&#xe0; Liquide)</strong>: denaro in cassa e depositi bancari a vista.","children":[],"payload":{"tag":"li","lines":"166,167"}},{"content":"<strong>Cash Equivalents (Mezzi Equivalenti)</strong>: investimenti finanziari a brevissimo termine prontamente convertibili in importi noti di denaro, soggetti a un <strong>rischio insignificante di variazione del valore</strong>, con <strong>scadenza originaria non superiore a 3 mesi</strong> dalla data di acquisto. Le azioni ordinarie sono escluse (troppo volatili).","children":[],"payload":{"tag":"li","lines":"167,168"}},{"content":"<strong>Scoperti di Conto Corrente</strong>: se rimborsabili a vista e gestiti quotidianamente per la cassa, vengono portati in detrazione della cassa netta.","children":[],"payload":{"tag":"li","lines":"168,169"}}],"payload":{"tag":"li","lines":"165,169"}},{"content":"<strong>Le 3 Macro-Aree Finanziarie</strong>","children":[{"content":"<strong>Attivit&#xe0; Operativa (<em>Operating Activities</em>)</strong>: flussi legati alla produzione e vendita di beni e servizi (il motore caratteristico che genera cassa).","children":[],"payload":{"tag":"li","lines":"170,171"}},{"content":"<strong>Attivit&#xe0; di Investimento (<em>Investing Activities</em>)</strong>: uscite per acquisti (<em>CapEx</em>) ed entrate per vendite di immobilizzazioni materiali (IAS 16), immateriali (IAS 38) e partecipazioni finanziarie a lungo termine.","children":[],"payload":{"tag":"li","lines":"171,172"}},{"content":"<strong>Attivit&#xe0; di Finanziamento (<em>Financing Activities</em>)</strong>: operazioni che modificano l&apos;entit&#xe0; e composizione del patrimonio netto (aumenti di capitale, dividendi pagati) e dei debiti finanziari (accensione/rimborso mutui e prestiti obbligazionari, quota capitale dei canoni leasing IFRS 16).","children":[],"payload":{"tag":"li","lines":"172,173"}}],"payload":{"tag":"li","lines":"169,173"}},{"content":"<strong>Il Metodo Indiretto Operativo (Riconciliazione del CCN)</strong>","children":[{"content":"Si parte dall&apos;Utile Netto (o ante imposte) del Conto Economico e lo si trasforma in flusso monetario:","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">U</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">l</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">N</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">o</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">&amp;</mi><mi mathvariant=\"bold\">L</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\mathbf{Utile\\ Netto\\ (P\\&amp;L)}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">Utile</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Netto</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">P&amp;L</span><span class=\"mclose\">)</span></span></span></span></span>","children":[],"payload":{"tag":"li","lines":"175,176"}},{"content":"<strong>(+) Costi non monetari</strong>: ammortamenti, accantonamenti a fondi rischi, perdite da svalutazione (sono costi che hanno abbassato l&apos;utile ma senza uscita di cassa).","children":[],"payload":{"tag":"li","lines":"176,177"}},{"content":"<strong>(-) Plusvalenze da cessione cespiti</strong>: la plusvalenza contabile va stornata dall&apos;utile operativo perch&#xe9; l&apos;intero corrispettivo monetario incassato dalla vendita del bene confluisce al 100% nell&apos;<strong>Attivit&#xe0; di Investimento</strong>!","children":[],"payload":{"tag":"li","lines":"177,178"}},{"content":"<strong>(-) Aumento Crediti verso Clienti / (+) Riduzione Crediti</strong>: se i crediti aumentano, abbiamo venduto merci ma non abbiamo ancora incassato il denaro (cassa non pervenuta <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> sottrarre).","children":[],"payload":{"tag":"li","lines":"178,180"}},{"content":"<strong>(-) Aumento Rimanenze di Magazzino / (+) Riduzione Rimanenze</strong>: se il magazzino cresce, abbiamo speso cassa per produrre scorte ferme sui pallet (cassa assorbita <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> sottrarre).","children":[],"payload":{"tag":"li","lines":"180,182"}},{"content":"<strong>(+) Aumento Debiti verso Fornitori / (-) Riduzione Debiti</strong>: se i debiti verso fornitori crescono, abbiamo acquistato beni senza ancora pagarli (cassa risparmiata <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> sommare); se diminuiscono, abbiamo pagato fatture pregresse (cassa uscita <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">g</span><span class=\"mord mathnormal\">h</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.0269em;\">w</span></span></span></span> sottrarre).","children":[],"payload":{"tag":"li","lines":"182,185"}}],"payload":{"tag":"li","lines":"174,185"}}],"payload":{"tag":"li","lines":"173,185"}},{"content":"<strong>Le Operazioni Non Monetarie (Quesito 02.1)</strong>","children":[{"content":"Operazioni di investimento o finanziamento che non richiedono esborso monetario immediato (es. acquisto di un impianto mediante stipula di un leasing IFRS 16, o permuta di immobili, o conversione di obbligazioni in azioni):","children":[],"payload":{"tag":"li","lines":"186,187"}},{"content":"<strong>Regola Tassativa</strong>: <strong>NON devono essere incluse nel prospetto del Rendiconto Finanziario</strong>. &#xc8; fatto divieto di esporre entrate e uscite fittizie; l&apos;operazione deve essere illustrata esclusivamente in un&apos;apposita <strong>nota informativa esplicativa</strong>.","children":[],"payload":{"tag":"li","lines":"187,189"}}],"payload":{"tag":"li","lines":"185,189"}}],"payload":{"tag":"h2","lines":"161,162"}},{"content":"5. Note al Bilancio &amp; Management Commentary","children":[{"content":"<strong>Note al Bilancio (IAS 1 / Modulo 03)</strong>","children":[{"content":"Le Note sono parte integrante e inscindibile del bilancio.","children":[],"payload":{"tag":"li","lines":"191,192"}},{"content":"<strong>Politiche Contabili (<em>Accounting Policies</em> - Quesito 03.1)</strong>: La nota informativa non deve limitarsi a ricopiare asetticamente i paragrafi degli IFRS; &#xe8; considerata utile solo se spiega <strong>come l&apos;azienda applica concretamente i criteri e le scelte contabili ai propri specifici progetti e al proprio modello di business</strong>.","children":[],"payload":{"tag":"li","lines":"192,193"}},{"content":"<strong>Fonti di Incertezza nelle Stime (<em>Estimation Uncertainty</em> - Quesito 03.2)</strong>: Obbligo per il management di indicare le assunzioni chiave sul futuro con rischio significativo di generare rettifiche materiali entro 12 mesi, fornendo la relativa <strong>analisi di sensibilit&#xe0; (<em>sensitivity analysis</em>)</strong> al variare delle ipotesi.","children":[],"payload":{"tag":"li","lines":"193,194"}},{"content":"<strong>Il Divieto di Sanatoria in Nota (Quesito 03.3)</strong>:","children":[{"content":"<em>Caso esame</em>: Una societ&#xe0; opera una compensazione non consentita tra attivit&#xe0; e passivit&#xe0; nello Stato Patrimoniale, ma indica analiticamente gli importi lordi nelle Note.","children":[],"payload":{"tag":"li","lines":"195,196"}},{"content":"<em>Regola</em>: <strong>La disclosure nelle Note NON SANA in alcun modo la compensazione o il trattamento errato commesso nei prospetti contabili primari</strong>.","children":[],"payload":{"tag":"li","lines":"196,197"}}],"payload":{"tag":"li","lines":"194,197"}}],"payload":{"tag":"li","lines":"190,197"}},{"content":"<strong>Management Commentary (IFRS Practice Statement 1 / Modulo 04)</strong>","children":[{"content":"Relazione narrativa della gestione vista &quot;attraverso gli occhi del management&quot; (<em>through the eyes of management</em>).","children":[],"payload":{"tag":"li","lines":"198,199"}},{"content":"<strong>Analisi dell&apos;Utile e Cessioni Straordinarie (Quesito 04.1)</strong>: Se l&apos;utile d&apos;esercizio cresce unicamente grazie alla vendita isolata di un immobile mentre i margini operativi della produzione calano, il management non pu&#xf2; mascherare il calo: ha l&apos;obbligo di isolare il contributo della cessione immobiliare e spiegare cause, andamento e prospettive della gestione ordinaria.","children":[],"payload":{"tag":"li","lines":"199,200"}},{"content":"<strong>Trasparenza sui Rischi e Perdita Clienti (Quesito 04.2)</strong>: La perdita di un cliente strategico va discussa esplicitando il grado di concentrazione del portafoglio clienti, le azioni correttive intraprese e i rischi operativi residui.","children":[],"payload":{"tag":"li","lines":"200,201"}},{"content":"<strong>Informazioni Prospettiche (<em>Forward-Looking</em> - Quesito 04.3)</strong>: Le previsioni di ripresa fornite agli investitori devono esplicitare le ipotesi adottate, le evidenze disponibili e i fattori di incertezza che possono deviare l&apos;esito finale.","children":[],"payload":{"tag":"li","lines":"201,202"}}],"payload":{"tag":"li","lines":"197,202"}},{"content":"<strong>Sustainability Reporting &amp; Nascita ISSB</strong>","children":[{"content":"La IFRS Foundation ha istituito l&apos;<strong>ISSB (International Sustainability Standards Board)</strong> alla conferenza COP26 di Glasgow per definire una <em>Global Baseline</em> di standard ESG per i mercati dei capitali.","children":[],"payload":{"tag":"li","lines":"203,204"}},{"content":"<strong>IFRS S1</strong>: Requisiti generali di sostenibilit&#xe0; articolati sui 4 pilastri TCFD (Governance, Strategia, Risk Management, Metriche e Target).","children":[],"payload":{"tag":"li","lines":"204,205"}},{"content":"<strong>IFRS S2</strong>: Standard tematico sul Clima (rischi fisici, rischi di transizione ed emissioni gas serra Scope 1, Scope 2 e Scope 3).","children":[],"payload":{"tag":"li","lines":"205,206"}},{"content":"<strong>Doppia Materialit&#xe0; a Confronto</strong>:","children":[{"content":"<strong>Materialit&#xe0; Finanziaria (Outside-in / ISSB)</strong>: Analizza come i fattori climatici ed ESG impattano il valore dell&apos;impresa e i suoi flussi di cassa (prospettiva dell&apos;investitore).","children":[],"payload":{"tag":"li","lines":"207,208"}},{"content":"<strong>Doppia Materialit&#xe0; (CSRD Europea ed ESRS di EFRAG)</strong>: Impone congiuntamente la materialit&#xe0; finanziaria (Outside-in) e la <strong>Materialit&#xe0; di Impatto (Inside-out)</strong>, ovvero l&apos;impatto generato dalle attivit&#xe0; aziendali sull&apos;ambiente, sui lavoratori e sulla societ&#xe0;.","children":[],"payload":{"tag":"li","lines":"208,210"}}],"payload":{"tag":"li","lines":"206,210"}}],"payload":{"tag":"li","lines":"202,210"}}],"payload":{"tag":"h2","lines":"189,190"}},{"content":"6. Seminario Ferrari: Finance in a Unique Business Model","children":[{"content":"<strong>Il Modello di Business Unico: Esclusivit&#xe0; vs Volumi</strong>","children":[{"content":"<strong>La Massima Fondativa di Enzo Ferrari</strong>: <em>&quot;Ferrari will always deliver one car less than the market demands&quot;</em>.","children":[],"payload":{"tag":"li","lines":"212,213"}},{"content":"L&apos;azienda rifiuta la logica della produzione di massa: la crescita del fatturato non avviene aumentando a dismisura le vetture consegnate (<em>shipments</em>), ma facendo leva sul <strong>Price/Mix</strong>, sull&apos;estrema personalizzazione delle vetture e sul lancio di serie speciali ad altissimo valore aggiunto (<em>Icona</em> e <em>Supercar</em>).","children":[],"payload":{"tag":"li","lines":"213,214"}}],"payload":{"tag":"li","lines":"211,214"}},{"content":"<strong>Le Metriche Finanziarie di Performance 2020-2025</strong>","children":[{"content":"<strong>Adjusted EBITDA Margin al 38.8% al 2025</strong>: Con un incremento di <strong>+580 punti base (bps) rispetto al 2020</strong>, attestandosi tra le marginalit&#xe0; pi&#xf9; elevate al mondo nel settore manifatturiero e del lusso.","children":[],"payload":{"tag":"li","lines":"215,216"}},{"content":"<strong>Free Cash Flow Industriale Cumulato (2020-2025) di ~&#x20ac;5.1 miliardi</strong>:","children":[{"content":"Elevatissimo <strong>Cash Conversion Ratio</strong>: la capacit&#xe0; di trasformare l&apos;EBITDA contabile in cassa reale (<em>Cash is King - IAS 7</em>).","children":[],"payload":{"tag":"li","lines":"217,218"}},{"content":"Questa imponente generazione di cassa garantisce l&apos;<strong>autofinanziamento completo dei massicci investimenti (CapEx)</strong> in ricerca e sviluppo tecnologico, Formula 1 e transizione elettrica/ibrida, senza dipendere da debito bancario esterno.","children":[],"payload":{"tag":"li","lines":"218,219"}}],"payload":{"tag":"li","lines":"216,219"}}],"payload":{"tag":"li","lines":"214,219"}},{"content":"<strong>Il Ruolo della Finanza: &quot;Finance Makes Trade-Offs Visible&quot;</strong>","children":[{"content":"La funzione Finance non &#xe8; un semplice ufficio di reporting contabile, ma il partner strategico che quantifica e rende visibili i <strong>4 grandi trade-off della gestione</strong>:","children":[{"content":"1. <strong>Growth vs Exclusivity</strong>: Aumentare le vendite o preservare la rarit&#xe0; e il valore collezionistico del marchio?","children":[],"payload":{"tag":"li","lines":"221,222","listIndex":1}},{"content":"2. <strong>Innovation vs Financial Discipline</strong>: Spese enormi in R&amp;D per motori ibridi/elettrici vs rispetto dei budget di cassa e ritorno del capitale.","children":[],"payload":{"tag":"li","lines":"222,223","listIndex":2}},{"content":"3. <strong>Global Consistency vs Local Dynamics</strong>: Mantenere una disciplina commerciale e di prezzo uniforme a livello globale, rispettando per&#xf2; le peculiarit&#xe0; dei mercati regionali (Americas, Europe/Africa, China/HK/Taiwan).","children":[],"payload":{"tag":"li","lines":"223,224","listIndex":3}},{"content":"4. <strong>Short-Term Performance vs Long-Term Value</strong>: Evitare decisioni miopi che migliorano l&apos;utile del trimestre a discapito della forza e reputazione secolare del brand.","children":[],"payload":{"tag":"li","lines":"224,225","listIndex":4}}],"payload":{"tag":"li","lines":"220,225"}}],"payload":{"tag":"li","lines":"219,225"}},{"content":"<strong>Il Processo Decisionale &quot;From Data to Decision&quot; in 5 Fasi</strong>","children":[{"content":"<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mn mathvariant=\"bold\">01.</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">B</mi><mi mathvariant=\"bold\">u</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">s</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">Q</mi><mi mathvariant=\"bold\">u</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">o</mi><mi mathvariant=\"bold\">n</mi></mrow><mi>i</mi><mi>g</mi><mi>h</mi><mi>t</mi><mi>a</mi><mi>r</mi><mi>r</mi><mi>o</mi><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{01.\\ Business\\ Question} \nightarrow</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">01.</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Business</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Qu
