ight:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">20.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"398,399"}},{"content":"<strong>Scrittura Contabile a Libro Giornale (Quesito 09.3)</strong>:<br>\n<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">I</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">i</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">P</mi><mi mathvariant=\"bold\">&amp;</mi><mi mathvariant=\"bold\">L</mi><mo stretchy=\"false\">)</mo><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext><mn mathvariant=\"bold\">5.000</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">D</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">b</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">t</mi><mi mathvariant=\"bold\">o</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">L</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">s</mi><mi mathvariant=\"bold\">i</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">g</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">S</mi><mi mathvariant=\"bold\">P</mi><mo stretchy=\"false\">)</mo><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext><mn mathvariant=\"bold\">20.000</mn><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">/</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">A</mi><mi mathvariant=\"bold\">v</mi><mi mathvariant=\"bold\">e</mi><mi mathvariant=\"bold\">r</mi><mi mathvariant=\"bold\">e</mi><mtext>&#xa0;</mtext><mi mathvariant=\"bold\">B</mi><mi mathvariant=\"bold\">a</mi><mi mathvariant=\"bold\">n</mi><mi mathvariant=\"bold\">c</mi><mi mathvariant=\"bold\">a</mi><mtext>&#xa0;</mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"bold\">S</mi><mi mathvariant=\"bold\">P</mi><mo stretchy=\"false\">)</mo><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext><mn mathvariant=\"bold\">25.000</mn></mrow><annotation encoding=\"application/x-tex\">\\mathbf{Dare\\ Interessi\\ Passivi\\ (P\\&amp;L)\\ &#x20ac;5.000\\ e\\ Dare\\ Debito\\ Leasing\\ (SP)\\ &#x20ac;20.000\\ /\\ Avere\\ Banca\\ (SP)\\ &#x20ac;25.000}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">Dare</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Interessi</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Passivi</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">P&amp;L</span><span class=\"mclose\">)</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span><span class=\"mord mathbf\">5.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">e</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Dare</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Debito</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\" style=\"margin-right:0.016em;\">Leasing</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">SP</span><span class=\"mclose\">)</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span><span class=\"mord mathbf\">20.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">/</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Avere</span><span class=\"mspace\">&#xa0;</span><span class=\"mord mathbf\">Banca</span><span class=\"mspace\">&#xa0;</span><span class=\"mopen\">(</span><span class=\"mord mathbf\">SP</span><span class=\"mclose\">)</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span><span class=\"mord mathbf\">25.000</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"399,401"}},{"content":"Debito residuo al 31/12: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>100.000</mn><mo>&#x2212;</mo><mn>20.000</mn><mo>=</mo><mn>80.000</mn><mtext>&#xa0;&#x20ac;</mtext></mrow><annotation encoding=\"application/x-tex\">100.000 - 20.000 = 80.000\\ &#x20ac;</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">100.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">20.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">80.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"401,402"}}],"payload":{"tag":"li","lines":"395,402"}},{"content":"<strong>Impatto sui Principali Indicatori Finanziari</strong>:","children":[{"content":"<strong>EBITDA</strong>: Aumenta notevolmente, perch&#xe9; i vecchi canoni di affitto (costi operativi) sono sostituiti da ammortamenti (sopra l&apos;EBIT) e interessi passivi (gestione finanziaria);","children":[],"payload":{"tag":"li","lines":"403,404"}},{"content":"<strong>Flussi di Cassa (IAS 7)</strong>: La cassa operativa migliora, perch&#xe9; la quota capitale del canone (&#x20ac;20.000) viene classificata nei flussi dell&apos;attivit&#xe0; di finanziamento (<em>Financing Cash Outflow</em>).","children":[],"payload":{"tag":"li","lines":"404,405"}}],"payload":{"tag":"li","lines":"402,405"}}],"payload":{"tag":"li","lines":"389,405"}},{"content":"<strong>Le 2 Esenzioni Pratiche per il Locatario (Quesito 09.4)</strong>","children":[{"content":"L&apos;IFRS 16 concede la facolt&#xe0; di NON applicare il modello ROU/Debito per due tipologie di leasing:","children":[{"content":"1. <strong>Leasing a Breve Termine (<em>Short-term leases</em>)</strong>: contratti con durata residua non superiore a 12 mesi che non contengono un&apos;opzione di acquisto;","children":[],"payload":{"tag":"li","lines":"407,408","listIndex":1}},{"content":"2. <strong>Leasing di Beni di Modico Valore (<em>Low-value assets</em>)</strong>: beni con valore a nuovo non superiore a circa 5.000 dollari (es. PC portatili, fotocopiatrici, telefoni cellulari).","children":[],"payload":{"tag":"li","lines":"408,409","listIndex":2}}],"payload":{"tag":"li","lines":"406,409"}},{"content":"<strong>Trattamento Contabile in Regime di Esenzione</strong>: I pagamenti dei canoni vengono imputati a Conto Economico a quote costanti come costi operativi per godimento di beni di terzi.","children":[],"payload":{"tag":"li","lines":"409,410"}},{"content":"<strong>Natura della Scelta (Quesito 09.4)</strong>: &#xc8; una facolt&#xe0; (<em>accounting policy choice</em>) che il locatario pu&#xf2; scegliere di applicare, <strong>non un obbligo cogente</strong>.","children":[],"payload":{"tag":"li","lines":"410,412"}}],"payload":{"tag":"li","lines":"405,412"}}],"payload":{"tag":"h2","lines":"367,368"}},{"content":"11. Criptovalute &#x2013; Utilizzo e Informazione Contabile","children":[{"content":"<strong>La Decisione dell&apos;IFRIC (Agenda Decision Giugno 2019)</strong>","children":[{"content":"L&apos;IFRIC (International Financial Reporting Interpretations Committee) ha emanato un&apos;agenda decision chiarificatrice per stabilire come contabilizzare la detenzione di criptovalute (es. Bitcoin, Ethereum) in assenza di un principio contabile IFRS specificamente dedicato.","children":[],"payload":{"tag":"li","lines":"414,415"}},{"content":"<strong>Cosa NON sono le Criptovalute? (Quesiti 10.1 &amp; 10.2)</strong>:","children":[{"content":"<strong>NON sono Moneta / Disponibilit&#xe0; Liquide</strong>: non hanno corso legale e non sono emesse o garantite da alcuna banca centrale.","children":[],"payload":{"tag":"li","lines":"416,417"}},{"content":"<strong>NON sono Equivalenti di Cassa (<em>Cash Equivalents</em> ex IAS 7) (Quesito 10.2)</strong>: non garantiscono un importo monetario fisso o convertibile a breve con rischio trascurabile. L&apos;estrema volatilit&#xe0; del prezzo impedisce l&apos;assimilazione al contante, e la negoziabilit&#xe0; su exchange non elimina il rischio di prezzo n&#xe9; equivale a un credito bancario.","children":[],"payload":{"tag":"li","lines":"417,418"}},{"content":"<strong>NON sono Attivit&#xe0; Finanziarie (<em>Financial Assets</em> ex IAS 32 / IFRS 9)</strong>: non rappresentano una quota di patrimonio netto di un&apos;altra entit&#xe0; n&#xe9; attribuiscono un diritto contrattuale a ricevere cassa da una controparte (non esiste alcun emittente obbligato a pagare).","children":[],"payload":{"tag":"li","lines":"418,419"}}],"payload":{"tag":"li","lines":"415,419"}}],"payload":{"tag":"li","lines":"413,419"}},{"content":"<strong>La Classificazione Basata sullo Scopo di Detenzione e Business Model (Quesito 10.1)</strong>","children":[{"content":"Il trattamento contabile corretto &#xe8; governato dallo <strong>scopo economico della detenzione e dal modello di attivit&#xe0; dell&apos;impresa</strong>:","children":[],"payload":{"tag":"li","lines":"420,421"}},{"content":"<strong>1. Modello IAS 2 &#x2013; Rimanenze (<em>Inventories</em>)</strong>:","children":[{"content":"Si applica quando le criptovalute sono <strong>detenute per la vendita nel normale svolgimento dell&apos;attivit&#xe0; aziendale</strong> (es. piattaforme di intermediazione, broker-dealer di criptovalute che acquistano e rivendono per generare margini commerciali a breve termine).","children":[],"payload":{"tag":"li","lines":"422,423"}},{"content":"<em>Regola Speciale per Broker-Dealer</em>: le rimanenze sono valutate al <strong>Fair Value al netto dei costi di vendita</strong>, con tutte le oscillazioni di valore imputate direttamente a <strong>Conto Economico (P&amp;L)</strong> nell&apos;esercizio di maturazione.","children":[],"payload":{"tag":"li","lines":"423,424"}},{"content":"<em>Per le altre imprese commerciali</em>: si valutano al minore tra costo storico e Valore Netto di Realizzo (NRV).","children":[],"payload":{"tag":"li","lines":"424,425"}}],"payload":{"tag":"li","lines":"421,425"}},{"content":"<strong>2. Modello IAS 38 &#x2013; Attivit&#xe0; Immateriali (<em>Intangible Assets</em>)</strong>:","children":[{"content":"Si applica in TUTTI gli altri casi: quando le criptovalute sono detenute come investimento a medio-lungo termine, per rivalutazione del capitale o riserva di valore patrimoniale.","children":[],"payload":{"tag":"li","lines":"426,427"}},{"content":"Rientrano in IAS 38 come attivit&#xe0; non monetarie identificabili prive di consistenza fisica. Poich&#xe9; non hanno scadenza contrattuale, sono considerate <strong>a vita utile indefinita</strong>:","children":[{"content":"<strong>Non si ammortizzano mai</strong>;","children":[],"payload":{"tag":"li","lines":"428,429"}},{"content":"Devono essere sottoposte a <strong>impairment test obbligatorio almeno una volta all&apos;anno ex IAS 36</strong>.","children":[],"payload":{"tag":"li","lines":"429,430"}}],"payload":{"tag":"li","lines":"427,430"}}],"payload":{"tag":"li","lines":"425,430"}}],"payload":{"tag":"li","lines":"419,430"}},{"content":"<strong>Trattamento delle Variazioni di Mercato e Incrementi di Prezzo (Quesito 10.3)</strong>","children":[{"content":"Un aumento della quotazione di mercato di Bitcoin non rappresenta automaticamente un utile di bilancio (Quesito 10.3). La contabilizzazione dipende dal modello adottato:","children":[{"content":"Sotto <strong>IAS 38 - Modello del Costo</strong>: il rialzo di prezzo <strong>NON si rileva a bilancio</strong> (rimane iscritta al costo storico meno svalutazioni passate);","children":[],"payload":{"tag":"li","lines":"432,433"}},{"content":"Sotto <strong>IAS 38 - Modello della Rideterminazione (<em>Revaluation Model</em>)</strong>: ammesso solo se esiste un mercato attivo (IFRS 13). L&apos;aumento di fair value si iscrive a <strong>OCI nella Riserva di Rivalutazione a Patrimonio Netto</strong>, e NON transita mai dal P&amp;L!","children":[],"payload":{"tag":"li","lines":"433,434"}},{"content":"Sotto <strong>IAS 2 - Commodity Broker-Dealer</strong>: l&apos;aumento transita a Conto Economico (P&amp;L) come utile da variazione di fair value.","children":[],"payload":{"tag":"li","lines":"434,435"}}],"payload":{"tag":"li","lines":"431,435"}}],"payload":{"tag":"li","lines":"430,435"}},{"content":"<strong>Informativa Integrativa nelle Note al Bilancio</strong>","children":[{"content":"Data l&apos;alta rischiosit&#xe0;, l&apos;impresa deve fornire un&apos;adeguata disclosure descrivendo:","children":[{"content":"La finalit&#xe0; economica della detenzione e i principi contabili prescelti;","children":[],"payload":{"tag":"li","lines":"437,438"}},{"content":"La gerarchia del Fair Value (Livello 1 con quotazioni su mercati attivi);","children":[],"payload":{"tag":"li","lines":"438,439"}},{"content":"L&apos;esposizione ai rischi di mercato, liquidit&#xe0;, cyber-sicurezza e perdita delle chiavi crittografiche private.","children":[],"payload":{"tag":"li","lines":"439,441"}}],"payload":{"tag":"li","lines":"436,441"}}],"payload":{"tag":"li","lines":"435,441"}}],"payload":{"tag":"h2","lines":"412,413"}},{"content":"12. IAS 36 &#x2013; Riduzione di Valore delle Attivit&#xe0; (Impairment of Assets)","children":[{"content":"<strong>Finalit&#xe0; e Concetto Economico di Impairment</strong>","children":[{"content":"<strong>Obiettivo Cardine</strong>: Assicurare che le attivit&#xe0; dell&apos;impresa non siano mai iscritte a un valore superiore al loro <strong>Valore Recuperabile (<em>Recoverable Amount</em>)</strong>, tutelando i lettori del bilancio da sopravvalutazioni patrimoniali ingannevoli.","children":[],"payload":{"tag":"li","lines":"443,444"}},{"content":"<strong>Quando un&apos;attivit&#xe0; &#xe8; svalutata (<em>impaired</em>)?</strong>: Quando il suo Valore Contabile (<em>Carrying Amount</em>) eccede l&apos;ammontare che l&apos;azienda pu&#xf2; recuperare tramite l&apos;uso continuativo o la vendita sul mercato. In tal caso, si deve rilevare immediatamente una <strong>Perdita per Riduzione di Valore (<em>Impairment Loss</em>)</strong> a Conto Economico.","children":[],"payload":{"tag":"li","lines":"444,445"}}],"payload":{"tag":"li","lines":"442,445"}},{"content":"<strong>Quando si Effettua l&apos;Impairment Test? (Trigger Events vs Test Annuale Obbligatorio)</strong>","children":[{"content":"<strong>Regola Generale (In Presenza di Indicatori di Perdita - <em>Trigger Events</em>)</strong>:","children":[{"content":"Per i normali cespiti materiali e immateriali a vita definita, il test si esegue solo se a fine esercizio emergono indicatori interni o esterni di perdita:","children":[{"content":"<em>Indicatori Esterni</em>: crollo del valore di mercato, aumenti dei tassi di interesse di mercato (che incrementano il tasso di attualizzazione riducendo il valore attuale), mutamenti normativi, legali o tecnologici avversi;","children":[],"payload":{"tag":"li","lines":"448,449"}},{"content":"<em>Indicatori Interni</em>: obsolescenza fisica dell&apos;impianto, piani di ristrutturazione o dismissione anticipata, performance economiche e flussi di cassa consuntivati peggiori delle previsioni di budget.","children":[],"payload":{"tag":"li","lines":"449,450"}}],"payload":{"tag":"li","lines":"447,450"}}],"payload":{"tag":"li","lines":"446,450"}},{"content":"<strong>LE 3 ECCEZIONI TASSATIVE: TEST ANNUALE OBBLIGATORIO A PRESCINDERE DA TRIGGER</strong>:","children":[{"content":"1. <strong>Avviamento (<em>Goodwill</em>)</strong> acquisito in un&apos;aggregazione aziendale;","children":[],"payload":{"tag":"li","lines":"451,452","listIndex":1}},{"content":"2. <strong>Attivit&#xe0; immateriali a vita utile indefinita</strong>;","children":[],"payload":{"tag":"li","lines":"452,453","listIndex":2}},{"content":"3. <strong>Attivit&#xe0; immateriali non ancora disponibili all&apos;uso</strong> (costi di sviluppo capitalizzati in corso).","children":[],"payload":{"tag":"li","lines":"453,454","listIndex":3}}],"payload":{"tag":"li","lines":"450,454"}}],"payload":{"tag":"li","lines":"445,454"}},{"content":"<strong>La Determinazione del Valore Recuperabile (Quesito 11.1)</strong>","children":[{"content":"<strong>La Regola del Massimo tra Due Valori</strong>:<p class=\"katex-block katex-error\" title=\"ext{Valore Recuperabile} = \\mathbf{MAGGIORE\\ tra:}\\ \begin{cases} \text{1. Fair Value al Netto dei Costi di Dismissione (Fair Value Less Costs of Disposal)} \\ \text{2. Valore d&apos;Uso (Value in Use - VIU)} \\end{cases}\n\">ParseError: KaTeX parse error: Unexpected character: &apos;\b&apos; at position 53: &#x2026;GGIORE\\ tra:}\\ \b&#x332;egin{cases} \tex&#x2026;</p>","children":[],"payload":{"tag":"li","lines":"455,457"}},{"content":"<em>Perch&#xe9; il MAGGIORE e non il minore?</em> Perch&#xe9; si presuppone la razionalit&#xe0; economica del management: se il bene produce pi&#xf9; cassa continuando a farlo lavorare nella produzione (Valore d&apos;Uso), l&apos;azienda lo terr&#xe0;; se invece vale di pi&#xf9; vendendolo subito sul mercato (Fair Value netto), l&apos;azienda lo dismetter&#xe0;.","children":[],"payload":{"tag":"li","lines":"457,458"}},{"content":"<strong>Risoluzione Esercizio Numerico d&apos;Esame (Quesito 11.1)</strong>:","children":[{"content":"Dati: Valore Contabile Impianto = &#x20ac;200.000; Fair Value = &#x20ac;175.000; Costi di dismissione = &#x20ac;5.000; Valore d&apos;Uso = &#x20ac;180.000.","children":[],"payload":{"tag":"li","lines":"459,460"}},{"content":"Calcolo Fair Value Netto: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>175.000</mn><mo>&#x2212;</mo><mn>5.000</mn><mo>=</mo><mrow><mn mathvariant=\"bold\">170.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">175.000 - 5.000 = \\mathbf{170.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">175.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">5.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">170.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span>.","children":[],"payload":{"tag":"li","lines":"460,461"}},{"content":"Valore Recuperabile: <span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>max</mi><mo>&#x2061;</mo><mo stretchy=\"false\">(</mo><mn>170.000</mn><mo separator=\"true\">,</mo><mn>180.000</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mrow><mn mathvariant=\"bold\">180.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\\max(170.000, 180.000) = \\mathbf{180.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mop\">max</span><span class=\"mopen\">(</span><span class=\"mord\">170.000</span><span class=\"mpunct\">,</span><span class=\"mspace\" style=\"margin-right:0.1667em;\"></span><span class=\"mord\">180.000</span><span class=\"mclose\">)</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">180.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span> (prevale il Valore d&apos;Uso!).","children":[],"payload":{"tag":"li","lines":"461,462"}},{"content":"<strong>Perdita di Valore da Rilevare (Quesito 11.1)</strong>:<br>\n<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>P</mi><mi>e</mi><mi>r</mi><mi>d</mi><mi>i</mi><mi>t</mi><mi>a</mi></mrow><mo>=</mo><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>V</mi><mi>a</mi><mi>l</mi><mi>o</mi><mi>r</mi><mi>e</mi><mi>C</mi><mi>o</mi><mi>n</mi><mi>t</mi><mi>a</mi><mi>b</mi><mi>i</mi><mi>l</mi><mi>e</mi><mo stretchy=\"false\">(</mo><mtext>&#x20ac;</mtext><mn>200.000</mn><mo stretchy=\"false\">)</mo></mrow><mo>&#x2212;</mo><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>V</mi><mi>a</mi><mi>l</mi><mi>o</mi><mi>r</mi><mi>e</mi><mi>R</mi><mi>e</mi><mi>c</mi><mi>u</mi><mi>p</mi><mi>e</mi><mi>r</mi><mi>a</mi><mi>b</mi><mi>i</mi><mi>l</mi><mi>e</mi><mo stretchy=\"false\">(</mo><mtext>&#x20ac;</mtext><mn>180.000</mn><mo stretchy=\"false\">)</mo></mrow><mo>=</mo><mrow><mn mathvariant=\"bold\">20.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Perdita} = \text{Valore Contabile (&#x20ac;200.000)} - \text{Valore Recuperabile (&#x20ac;180.000)} = \\mathbf{20.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.6944em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">er</span><span class=\"mord mathnormal\">d</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">a</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\">n</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">abi</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\">e</span><span class=\"mopen\">(</span><span class=\"mord\">&#x20ac;200.000</span><span class=\"mclose\">)</span></span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.2222em;\">V</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">or</span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\" style=\"margin-right:0.0077em;\">R</span><span class=\"mord mathnormal\">ec</span><span class=\"mord mathnormal\">u</span><span class=\"mord mathnormal\">p</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">er</span><span class=\"mord mathnormal\">abi</span><span class=\"mord mathnormal\" style=\"margin-right:0.0197em;\">l</span><span class=\"mord mathnormal\">e</span><span class=\"mopen\">(</span><span class=\"mord\">&#x20ac;180.000</span><span class=\"mclose\">)</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">20.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span> a Conto Economico.","children":[],"payload":{"tag":"li","lines":"462,464"}}],"payload":{"tag":"li","lines":"458,464"}}],"payload":{"tag":"li","lines":"454,464"}},{"content":"<strong>Il Valore d&apos;Uso (<em>Value in Use</em>) in Dettaglio (Dalle Slide d&apos;Aula <code>Value in use.pdf</code>)</strong>","children":[{"content":"<strong>Definizione</strong>: Il valore attuale dei flussi finanziari futuri attesi che si prevede origineranno dall&apos;uso continuativo di un&apos;attivit&#xe0; (o CGU) e dalla sua dismissione finale.","children":[],"payload":{"tag":"li","lines":"465,466"}},{"content":"<strong>I 3 Pilastri di Calcolo</strong>:","children":[{"content":"1. Proiezioni dei flussi di cassa operativi basate sui budget formali pi&#xf9; recenti approvati dal management (orizzonte temporale massimo ordinario di 5 anni);","children":[],"payload":{"tag":"li","lines":"467,468","listIndex":1}},{"content":"2. Tasso di crescita costante o decrescente per il periodo successivo (<em>terminal value</em>), che non pu&#xf2; superare il tasso medio di crescita a lungo termine del settore o del Paese;","children":[],"payload":{"tag":"li","lines":"468,469","listIndex":2}},{"content":"3. <strong>Tasso di Attualizzazione</strong>: deve essere un <strong>tasso al lordo delle imposte (<em>Pre-tax discount rate</em>)</strong>, calcolato sul WACC dell&apos;azienda e adeguato ai rischi specifici dell&apos;attivit&#xe0; per cui i flussi non sono stati rettificati.","children":[],"payload":{"tag":"li","lines":"469,470","listIndex":3}}],"payload":{"tag":"li","lines":"466,470"}},{"content":"<strong>La Regola dello &quot;Stato Attuale&quot; (<em>As-Is Condition</em>)</strong>:","children":[{"content":"Le stime dei flussi finanziari futuri devono riflettere l&apos;attivit&#xe0; nelle sue condizioni attuali. Sono tassativamente <strong>ESCLUSI</strong>:","children":[{"content":"Flussi in entrata o uscita derivanti da future ristrutturazioni a cui l&apos;impresa non &#xe8; ancora legalmente vincolata;","children":[],"payload":{"tag":"li","lines":"472,473"}},{"content":"Flussi finanziari incrementali derivanti da futuri investimenti volti a migliorare o espandere le prestazioni produttive dell&apos;attivit&#xe0;.","children":[],"payload":{"tag":"li","lines":"473,474"}}],"payload":{"tag":"li","lines":"471,474"}}],"payload":{"tag":"li","lines":"470,474"}}],"payload":{"tag":"li","lines":"464,474"}},{"content":"<strong>La Cash-Generating Unit (CGU) e i Corporate Assets (Quesito 11.3)</strong>","children":[{"content":"<strong>Quando si fa il test sulla CGU? (Quesito 11.3)</strong>:","children":[{"content":"Se una singola attivit&#xe0; non genera entrate finanziarie ampiamente indipendenti da quelle originate da altre attivit&#xe0; (es. un robot di saldatura all&apos;interno di una catena di montaggio), &#xe8; impossibile stimare il Valore d&apos;Uso del singolo macchinario.","children":[],"payload":{"tag":"li","lines":"476,477"}},{"content":"Si individua allora la <strong>Cash-Generating Unit (CGU)</strong>: il <strong>pi&#xf9; piccolo gruppo identificabile di attivit&#xe0; che genera entrate finanziarie ampiamente indipendenti</strong> dai flussi in entrata generati da altre attivit&#xe0;.","children":[],"payload":{"tag":"li","lines":"477,478"}}],"payload":{"tag":"li","lines":"475,478"}},{"content":"<strong>Corporate Assets (Sede Centrale, Sistemi IT, Centri R&amp;D Condivisi)</strong>:","children":[{"content":"Sono attivit&#xe0; aziendali che contribuiscono ai flussi futuri di pi&#xf9; CGU ma non generano flussi autonomi.","children":[],"payload":{"tag":"li","lines":"479,480"}},{"content":"<strong>Test Bottom-up vs Top-down (Slide d&apos;Aula <code>Value in use.pdf</code>)</strong>:","children":[{"content":"Se il Corporate Asset pu&#xf2; essere allocato su base ragionevole e coerente alle singole CGU (es. proporzionalmente al valore contabile ponderato per la vita utile residua), si effettua il test <strong>Bottom-up</strong> allocando la quota a ciascuna CGU;","children":[],"payload":{"tag":"li","lines":"481,482"}},{"content":"Se una quota del Corporate Asset non &#xe8; allocabile su basi coerenti, si applica il test <strong>Top-down</strong>: si verifica prima ogni CGU senza corporate asset, e poi si testa la macro-unit&#xe0; aggregata che incorpora il Corporate Asset residuo.","children":[],"payload":{"tag":"li","lines":"482,483"}}],"payload":{"tag":"li","lines":"480,483"}}],"payload":{"tag":"li","lines":"478,483"}}],"payload":{"tag":"li","lines":"474,483"}},{"content":"<strong>Ordine di Allocazione della Perdita per Riduzione di Valore nella CGU</strong>","children":[{"content":"Quando il valore contabile complessivo di una CGU supera il suo valore recuperabile, la perdita per riduzione di valore viene imputata seguendo una sequenza gerarchica inderogabile:","children":[{"content":"1. <strong>In primo luogo, si azzera l&apos;Avviamento (<em>Goodwill</em>)</strong> allocato a quella CGU;","children":[],"payload":{"tag":"li","lines":"485,486","listIndex":1}},{"content":"2. <strong>In secondo luogo, l&apos;eventuale perdita residua viene ripartita pro-quota tra le altre attivit&#xe0; della CGU</strong>, proporzionalmente al valore contabile di ciascuna attivit&#xe0;.","children":[],"payload":{"tag":"li","lines":"486,487","listIndex":2}}],"payload":{"tag":"li","lines":"484,487"}},{"content":"<em>Clausola di Salvaguardia Individuale</em>: Nessuna singola attivit&#xe0; pu&#xf2; essere svalutata al di sotto del valore pi&#xf9; elevato tra:","children":[{"content":"Il suo Fair Value al netto dei costi di dismissione (se determinabile);","children":[],"payload":{"tag":"li","lines":"488,489"}},{"content":"Il suo Valore d&apos;Uso (se determinabile);","children":[],"payload":{"tag":"li","lines":"489,490"}},{"content":"Zero.","children":[],"payload":{"tag":"li","lines":"490,491"}},{"content":"L&apos;eventuale perdita non assorbita da tale bene viene redistribuita pro-quota sulle restanti attivit&#xe0; della CGU.","children":[],"payload":{"tag":"li","lines":"491,492"}}],"payload":{"tag":"li","lines":"487,492"}}],"payload":{"tag":"li","lines":"483,492"}},{"content":"<strong>Ripristino di Valore (<em>Reversal of Impairment</em>) (Quesiti 11.2 &amp; 11.4)</strong>","children":[{"content":"<strong>DIVIETO ASSOLUTO E CATEGORICO PER L&apos;AVVIAMENTO (Quesito 11.4)</strong>:","children":[{"content":"Una perdita per riduzione di valore rilevata per l&apos;<strong>Avviamento NON PU&#xd2; MAI ESSERE RIPRISTINATA</strong> in esercizi successivi. Nemmeno se le prospettive economiche della CGU migliorano radicalmente e il valore recuperabile esplode verso l&apos;alto!","children":[],"payload":{"tag":"li","lines":"494,495"}},{"content":"<em>Motivazione teorica</em>: Qualsiasi ripristino successivo dell&apos;avviamento equivarrebbe alla rilevazione di un avviamento generato internamente, pratica severamente vietata dallo IAS 38.","children":[],"payload":{"tag":"li","lines":"495,496"}}],"payload":{"tag":"li","lines":"493,496"}},{"content":"<strong>Ripristino per le Altre Attivit&#xe0; e la Regola del Tetto Massimo (Quesito 11.2)</strong>:","children":[{"content":"Per tutti gli altri cespiti (impianti, brevetti), se in un esercizio successivo le stime cambiano e il valore recuperabile aumenta, la perdita passata viene stornata a Conto Economico come utile da ripristino di valore (<em>Reversal</em>).","children":[],"payload":{"tag":"li","lines":"497,498"}},{"content":"<strong>LA REGOLA DEL TETTO MASSIMO (<em>Ceiling Rule</em>)</strong>: Il nuovo valore contabile del bene <strong>NON PU&#xd2; MAI SUPERARE il valore contabile netto che l&apos;attivit&#xe0; avrebbe avuto se la svalutazione originaria non fosse mai avvenuta (ossia al netto dei normali ammortamenti storici teorici)</strong>!","children":[],"payload":{"tag":"li","lines":"498,499"}}],"payload":{"tag":"li","lines":"496,499"}},{"content":"<strong>Risoluzione Esercizio Numerico d&apos;Esame (Quesito 11.2)</strong>:","children":[{"content":"Dati: Attivit&#xe0; valutata al costo con valore contabile residuo = &#x20ac;64.000 dopo precedente svalutazione; Nuovo valore recuperabile stimato = &#x20ac;95.000; Valore netto che l&apos;attivit&#xe0; avrebbe avuto alla stessa data applicando i normali ammortamenti senza alcuna svalutazione passata = &#x20ac;84.000.","children":[],"payload":{"tag":"li","lines":"500,501"}},{"content":"Determinazione del Tetto Massimo ammissibile: il valore contabile pu&#xf2; salire fino a un massimo di <strong>&#x20ac;84.000</strong> (non a &#x20ac;95.000!).","children":[],"payload":{"tag":"li","lines":"501,502"}},{"content":"<strong>Ripristino Massimo Rilevabile a Conto Economico (Quesito 11.2)</strong>:<br>\n<span class=\"katex\"><span class=\"katex-mathml\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>R</mi><mi>i</mi><mi>p</mi><mi>r</mi><mi>i</mi><mi>s</mi><mi>t</mi><mi>i</mi><mi>n</mi><mi>o</mi><mi>M</mi><mi>a</mi><mi>s</mi><mi>s</mi><mi>i</mi><mi>m</mi><mi>o</mi></mrow><mo>=</mo><mn>84.000</mn><mo>&#x2212;</mo><mn>64.000</mn><mo>=</mo><mrow><mn mathvariant=\"bold\">20.000</mn><mtext>&#xa0;</mtext><mtext mathvariant=\"bold\">&#x20ac;</mtext></mrow></mrow><annotation encoding=\"application/x-tex\">\text{Ripristino Massimo} = 84.000 - 64.000 = \\mathbf{20.000\\ &#x20ac;}</annotation></semantics></math></span><span class=\"katex-html\" aria-hidden=\"true\"><span class=\"base\"><span class=\"strut\" style=\"height:0.8778em;vertical-align:-0.1944em;\"></span><span class=\"mord mathnormal\">e</span><span class=\"mord mathnormal\">x</span><span class=\"mord mathnormal\">t</span><span class=\"mord\"><span class=\"mord mathnormal\" style=\"margin-right:0.0077em;\">R</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">p</span><span class=\"mord mathnormal\" style=\"margin-right:0.0278em;\">r</span><span class=\"mord mathnormal\">i</span><span class=\"mord mathnormal\">s</span><span class=\"mord mathnormal\">t</span><span class=\"mord mathnormal\">in</span><span class=\"mord mathnormal\">o</span><span class=\"mord mathnormal\" style=\"margin-right:0.109em;\">M</span><span class=\"mord mathnormal\">a</span><span class=\"mord mathnormal\">ss</span><span class=\"mord mathnormal\">im</span><span class=\"mord mathnormal\">o</span></span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\"></span><span class=\"mord\">84.000</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span><span class=\"mbin\">&#x2212;</span><span class=\"mspace\" style=\"margin-right:0.2222em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\">64.000</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span><span class=\"mrel\">=</span><span class=\"mspace\" style=\"margin-right:0.2778em;\"></span></span><span class=\"base\"><span class=\"strut\" style=\"height:0.6444em;\"></span><span class=\"mord\"><span class=\"mord mathbf\">20.000</span><span class=\"mspace\">&#xa0;</span><span class=\"mord\">&#x20ac;</span></span></span></span></span> (imputato come provento a P&amp;L).","children":[],"payload":{"tag":"li","lines":"502,504"}}],"payload":{"tag":"li","lines":"499,504"}}],"payload":{"tag":"li","lines":"492,504"}}],"payload":{"tag":"h2","lines":"441,442"}}],"payload":{"tag":"h1","lines":"7,8"}},{"colorFreezeLevel":2,"maxWidth":380})</script>
