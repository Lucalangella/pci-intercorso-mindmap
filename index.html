            })(() => window.markmap,null,{"content":"Principi Contabili Internazionali &#x2013; Modulo 1","children":[{"content":"1. Conceptual Framework for Financial Reporting (2018)","children":[{"content":"<strong>Natura e Status Giuridico</strong>","children":[{"content":"Non &#xe8; un principio contabile IFRS/IAS","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"Non prevale sugli IFRS specifici (prevale sempre lo standard)","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"Guida lo IASB nella formulazione di standard coerenti","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"Gerarchia IAS 8: fonte di riferimento per i preparers in assenza di IFRS specifici","children":[],"payload":{"tag":"li","lines":"14,15"}}],"payload":{"tag":"li","lines":"10,15"}},{"content":"<strong>Obiettivo e Destinatari Primari</strong>","children":[{"content":"General Purpose Financial Reporting: utilit&#xe0; decisionale (<em>decision-usefulness</em>)","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"Primary Users: Investitori e Finanziatori/Creditori attuali e potenziali","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"Focus informativo: stima di ammontare, tempistica e incertezza dei flussi di cassa futuri","children":[],"payload":{"tag":"li","lines":"18,19"}},{"content":"Entity Perspective: bilancio dal punto di vista dell&apos;impresa come soggetto autonomo","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"Postulato di Continuit&#xe0; Aziendale (<em>Going Concern Assumption</em> &gt;= 12 mesi)","children":[],"payload":{"tag":"li","lines":"20,21"}}],"payload":{"tag":"li","lines":"15,21"}},{"content":"<strong>Reporting Entity vs Legal Entity</strong>","children":[{"content":"Reporting Entity = perimetro economico-sostanziale (<em>substance over form</em>)","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"Reporting Entity &gt; Legal Entity: <strong>Bilancio Consolidato</strong> (gruppo capogruppo-figlie)","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"Reporting Entity &lt; Legal Entity: <strong>Segment Reporting</strong> (singola divisione o carve-out)","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Societ&#xe0; sotto controllo comune (<em>Common control</em>): <strong>Bilancio Combinato</strong>","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"Bilancio Non Consolidato (Separato): la reporting entity &#xe8; la sola madre (controllate = voce &quot;Partecipazioni&quot; IAS 27)","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"Boundaries: divieto assoluto di cherry-picking arbitrario","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"li","lines":"21,28"}},{"content":"<strong>Caratteristiche Qualitative Fondamentali</strong>","children":[{"content":"<strong>Significativit&#xe0; (Relevance)</strong>","children":[{"content":"Capacit&#xe0; di incidere sulle decisioni economiche degli utenti","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"Valore predittivo (<em>predictive</em>) &amp; Valore di conferma (<em>confirmatory</em>)","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"<strong>Rilevanza (Materiality)</strong>: specifica per l&apos;entit&#xe0;","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"Dimensione Quantitativa: soglia benchmark del <strong>5% nella stima dell&apos;utile</strong>","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"Dimensione Qualitativa: natura del fenomeno (covenants, parti correlate, inversione utile/perdita)","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"Four-Step Materiality Process (Practice Statement 2): 1. Identify -&gt; 2. Assess -&gt; 3. Organise -&gt; 4. Review","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"Divieto di oscuramento (<em>anti-obscuring</em>)","children":[],"payload":{"tag":"li","lines":"36,37"}}],"payload":{"tag":"li","lines":"29,37"}},{"content":"<strong>Rappresentazione Fedele (Faithful Representation)</strong>","children":[{"content":"Prevalenza della sostanza sulla forma","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"Completezza (<em>complete</em>): include tutte le info per comprendere il fenomeno","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"Assenza di errori procedurali (<em>free from error</em> nelle stime)","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"Neutralit&#xe0; (<em>neutral</em>): informazione non manipolata o polarizzata","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"<strong>Prudenza (Cautious Prudence)</strong>: esercizio di cautela nelle stime in condizioni di incertezza","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"Divieto di prudenza asimmetrica e divieto di riserve occulte (violerebbero la neutralit&#xe0; futura)","children":[],"payload":{"tag":"li","lines":"43,44"}}],"payload":{"tag":"li","lines":"37,44"}}],"payload":{"tag":"li","lines":"28,44"}},{"content":"<strong>Caratteristiche Qualitative di Potenziamento</strong>","children":[{"content":"Comparabilit&#xe0; (<em>Comparability</em>): intertemporale e interaziendale (non &#xe8; uniformit&#xe0; cieca)","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"Verificabilit&#xe0; (<em>Verifiability</em>): consenso tra osservatori indipendenti (diretta vs indiretta)","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"Tempestivit&#xe0; (<em>Timeliness</em>): info disponibile in tempo per orientare decisioni","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"Comprensibilit&#xe0; (<em>Understandability</em>): chiara e concisa (presuppone utenti con ragionevole diligenza)","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"Vincolo del Costo (<em>Cost Constraint</em>): benefici &gt; costi sostenuti","children":[],"payload":{"tag":"li","lines":"49,50"}}],"payload":{"tag":"li","lines":"44,50"}},{"content":"<strong>Elementi del Bilancio (Definizioni 2018)</strong>","children":[{"content":"Attivit&#xe0; (<em>Asset</em>): risorsa economica presente controllata, diritto con potenziale di benefici economici","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"Passivit&#xe0; (<em>Liability</em>): obbligazione attuale al trasferimento di una risorsa (<em>no practical ability to avoid</em>)","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Patrimonio Netto (<em>Equity</em>): interesse residuo nelle attivit&#xe0; dedotte le passivit&#xe0;","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"Ricavi (<em>Income</em>) &amp; Costi (<em>Expenses</em>): variazioni di asset/liability che variano l&apos;equity (esclusi apporti/prelievi soci)","children":[],"payload":{"tag":"li","lines":"54,55"}}],"payload":{"tag":"li","lines":"50,55"}},{"content":"<strong>Recognition &amp; Derecognition</strong>","children":[{"content":"Recognition: rilevazione se produce info significative e fedeli (valutazione incertezza di misura)","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"Derecognition: storno quando si perde il controllo dell&apos;asset o si estingue l&apos;obbligazione","children":[],"payload":{"tag":"li","lines":"57,58"}}],"payload":{"tag":"li","lines":"55,58"}},{"content":"<strong>Basi di Misurazione (Measurement Bases)</strong>","children":[{"content":"Costo Storico (<em>Historical Cost</em>): prezzo della transazione originale","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Valori Correnti (<em>Current Value</em>):","children":[{"content":"Fair Value (IFRS 13): prezzo di mercato d&apos;uscita, non entity-specific","children":[],"payload":{"tag":"li","lines":"61,62"}},{"content":"Valore d&apos;Uso (Attivit&#xe0;) / Valore di Adempimento (Passivit&#xe0;): flussi attualizzati, entity-specific","children":[],"payload":{"tag":"li","lines":"62,63"}},{"content":"Costo Corrente (<em>Current Cost</em>): valore di sostituzione attuale","children":[],"payload":{"tag":"li","lines":"63,64"}}],"payload":{"tag":"li","lines":"60,64"}}],"payload":{"tag":"li","lines":"58,64"}},{"content":"<strong>Capitale e Capital Maintenance</strong>","children":[{"content":"Capitale Finanziario Nominale: mantenimento euro nominali (costo storico)","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"Capitale Finanziario Reale: mantenimento potere d&apos;acquisto (rettificato per inflazione)","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"Capitale Fisico: mantenimento capacit&#xe0; produttiva/operativa (costi correnti, no utili a P&amp;L)","children":[],"payload":{"tag":"li","lines":"67,68"}}],"payload":{"tag":"li","lines":"64,68"}},{"content":"<strong>Incoerenze dello IASB</strong>","children":[{"content":"Business Model (IFRS 9) vs Business Activity (Framework 2018)","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"Asimmetrie Fair Value vs Costo Ammortizzato","children":[],"payload":{"tag":"li","lines":"70,71"}},{"content":"Assenza di un principio teorico univoco per separare P&amp;L da OCI (recycling selettivo)","children":[],"payload":{"tag":"li","lines":"71,73"}}],"payload":{"tag":"li","lines":"68,73"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"2. IAS 1 &#x2013; Presentazione del Bilancio","children":[{"content":"<strong>Set Completo del Bilancio</strong>","children":[{"content":"Stato Patrimoniale (<em>Statement of Financial Position</em>)","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"Conto Economico e OCI (<em>Statement of Profit or Loss and Other Comprehensive Income</em>)","children":[],"payload":{"tag":"li","lines":"76,77"}},{"content":"Prospetto delle Variazioni di Patrimonio Netto (<em>Statement of Changes in Equity</em>)","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"Rendiconto Finanziario (<em>Statement of Cash Flows</em> - IAS 7)","children":[],"payload":{"tag":"li","lines":"78,79"}},{"content":"Note al Bilancio (<em>Notes</em>)","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"Terzo SP di apertura in caso di restatement retrospettivo (IAS 8)","children":[],"payload":{"tag":"li","lines":"80,81"}}],"payload":{"tag":"li","lines":"74,81"}},{"content":"<strong>Postulati Generali di Redazione</strong>","children":[{"content":"Fair presentation &amp; Compliance IFRS (con eventuale rarissimo True and Fair Override)","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"Continuit&#xe0; aziendale (<em>Going Concern</em>)","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"Competenza Economica (<em>Accrual Basis</em> - per tutti i prospetti tranne IAS 7)","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"Rilevanza e Aggregazione (disaggregare voci dissimili)","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"<strong>Divieto di Compensazione (Offsetting)</strong> tra attivit&#xe0; e passivit&#xe0; o ricavi e costi","children":[],"payload":{"tag":"li","lines":"86,87"}},{"content":"Frequenza almeno annuale e informativa comparativa minima (t-1)","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"Costanza di presentazione (<em>Consistency</em>)","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"<strong>Divieto di Voci Straordinarie (<em>Extraordinary Items</em>)</strong> sia a P&amp;L sia nelle Note","children":[],"payload":{"tag":"li","lines":"89,90"}}],"payload":{"tag":"li","lines":"81,90"}},{"content":"<strong>Stato Patrimoniale: Corrente vs Non Corrente</strong>","children":[{"content":"Presentazione Corrente/Non Corrente obbligatoria (salvo criterio liquidit&#xe0; per banche)","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"<strong>Criteri Attivit&#xe0; Corrente</strong>:","children":[{"content":"Nel normale ciclo operativo (anche se &gt; 12 mesi, es. vino, navi, formaggi stagionati)","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"Posseduta per trading","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"Realizzo entro 12 mesi dalla data di bilancio","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"Cassa e disponibilit&#xe0; liquide non vincolate","children":[],"payload":{"tag":"li","lines":"96,97"}}],"payload":{"tag":"li","lines":"92,97"}},{"content":"<strong>Criteri Passivit&#xe0; Corrente</strong>: estinzione nel ciclo operativo, trading, scadenza entro 12 mesi, nessun diritto incondizionato a differire oltre 12 mesi","children":[],"payload":{"tag":"li","lines":"97,98"}},{"content":"<strong>Current Ratio</strong>: Attivit&#xe0; Correnti / Passivit&#xe0; Correnti (solvibilit&#xe0; a breve termine)","children":[],"payload":{"tag":"li","lines":"98,99"}}],"payload":{"tag":"li","lines":"90,99"}},{"content":"<strong>Performance Economica: Total Comprehensive Income (TCI)</strong>","children":[{"content":"TCI = Profit or Loss (P&amp;L) + Other Comprehensive Income (OCI)","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"Single Statement vs Two-Statement Approach","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"<strong>P&amp;L</strong>: reddito ordinario realizzato (base per dividendi, EPS IAS 33, bonus management)","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"<strong>OCI</strong>: costi e ricavi non realizzati da specifici standard per evitare volatilit&#xe0; a P&amp;L","children":[],"payload":{"tag":"li","lines":"103,104"}}],"payload":{"tag":"li","lines":"99,104"}},{"content":"<strong>La Disciplina del Recycling (Reclassification Adjustment)</strong>","children":[{"content":"Evita la doppia imputazione nel Total Comprehensive Income","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"<strong>Voci CON Recycling (Reclassificabili a P&amp;L alla chiusura)</strong>:","children":[{"content":"Riserva titoli di debito FVOCI (IFRS 9)","children":[],"payload":{"tag":"li","lines":"107,108"}},{"content":"Riserva Cash Flow Hedge (IFRS 9 - parte efficace coperture)","children":[],"payload":{"tag":"li","lines":"108,109"}},{"content":"Riserva conversione gestioni estere (IAS 21)","children":[],"payload":{"tag":"li","lines":"109,110"}}],"payload":{"tag":"li","lines":"106,110"}},{"content":"<strong>Voci SENZA Recycling (MAI a P&amp;L, transito diretto a Utili Portati a Nuovo)</strong>:","children":[{"content":"Riserva di rivalutazione immobili/impianti (<em>Revaluation Surplus</em> IAS 16 e IAS 38)","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"Azioni e partecipazioni designate a FVOCI (IFRS 9)","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"Utili e perdite attuariali su fondi pensione e TFR (IAS 19)","children":[],"payload":{"tag":"li","lines":"113,114"}},{"content":"Rischio di credito proprio (<em>Own credit risk</em>) su debiti a Fair Value","children":[],"payload":{"tag":"li","lines":"114,115"}}],"payload":{"tag":"li","lines":"110,115"}}],"payload":{"tag":"li","lines":"104,115"}},{"content":"<strong>Classificazione Costi Operativi a P&amp;L</strong>","children":[{"content":"Per Natura: materie prime, personale, ammortamenti (semplice, tipo civilistico)","children":[],"payload":{"tag":"li","lines":"116,117"}},{"content":"Per Destinazione: Costo del venduto, commerciali, amministrativi (evidenzia Gross Margin)","children":[],"payload":{"tag":"li","lines":"117,118"}},{"content":"Se per destinazione: <strong>disclosure obbligatoria in nota</strong> per costi del personale e ammortamenti","children":[],"payload":{"tag":"li","lines":"118,120"}}],"payload":{"tag":"li","lines":"115,120"}}],"payload":{"tag":"h2","lines":"73,74"}},{"content":"3. IFRS 18 &#x2013; Nuova Presentazione e Disclosure (2027)","children":[{"content":"<strong>Genesi e Obiettivi</strong>","children":[{"content":"Emesso ad aprile 2024, in vigore dal 1&#xb0; gennaio 2027, <strong>sostituisce integralmente lo IAS 1</strong>","children":[],"payload":{"tag":"li","lines":"122,123"}},{"content":"Risolve l&apos;opacit&#xe0; dello IAS 1: standardizza i subtotali e disciplina le misure non-GAAP","children":[],"payload":{"tag":"li","lines":"123,124"}}],"payload":{"tag":"li","lines":"121,124"}},{"content":"<strong>Le 3 Categorie Rigide del Conto Economico</strong>","children":[{"content":"<strong>1. Categoria Operativa (Operating)</strong>:","children":[{"content":"Attivit&#xe0; operative caratteristiche/primarie","children":[],"payload":{"tag":"li","lines":"126,127"}},{"content":"<strong>Categoria RESIDUALE</strong>: accoglie tutto ci&#xf2; che non &#xe8; Investing, Financing, Tax o IFRS 5","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"Include costi insoliti, ristrutturazioni e contenziosi operativi","children":[],"payload":{"tag":"li","lines":"128,129"}}],"payload":{"tag":"li","lines":"125,129"}},{"content":"<strong>2. Categoria di Investimento (Investing)</strong>:","children":[{"content":"Rendimenti da asset indipendenti (canoni/plusvalenze immobili investimento IAS 40)","children":[],"payload":{"tag":"li","lines":"130,131"}},{"content":"Dividendi e interessi da titoli finanziari non operativi","children":[],"payload":{"tag":"li","lines":"131,132"}},{"content":"Quota utili/perdite di collegate e Joint Venture a patrimonio netto (IAS 28)","children":[],"payload":{"tag":"li","lines":"132,133"}}],"payload":{"tag":"li","lines":"129,133"}},{"content":"<strong>3. Categoria di Finanziamento (Financing)</strong>:","children":[{"content":"Passivit&#xe0; derivanti dalla raccolta di finanziamenti (interessi passivi mutui, bond, leasing IFRS 16)","children":[],"payload":{"tag":"li","lines":"134,135"}},{"content":"Effetti di attualizzazione finanziaria (IAS 37)","children":[],"payload":{"tag":"li","lines":"135,136"}}],"payload":{"tag":"li","lines":"133,136"}}],"payload":{"tag":"li","lines":"124,136"}},{"content":"<strong>I 2 Nuovi Subtotali Obbligatori</strong>","children":[{"content":"<strong>Risultato Operativo (Operating Profit / EBIT standardizzato)</strong>","children":[],"payload":{"tag":"li","lines":"137,138"}},{"content":"<strong>Utile prima di Finanziamento e Imposte (Profit before financing and income taxes)</strong>","children":[],"payload":{"tag":"li","lines":"138,139"}}],"payload":{"tag":"li","lines":"136,139"}},{"content":"<strong>Disciplina Rigorosa delle MPMs (Management Performance Measures)</strong>","children":[{"content":"Subtotali di ricavi/costi non-GAAP usati dal management in presentazioni pubbliche (es. Adjusted EBIT)","children":[],"payload":{"tag":"li","lines":"140,141"}},{"content":"Devono entrare ufficialmente in una <strong>nota dedicata del bilancio</strong>","children":[],"payload":{"tag":"li","lines":"141,142"}},{"content":"Requisiti in nota: spiegazione dell&apos;utilit&#xe0;, formula, riconciliazione analitica con subtotale IFRS, impatto fiscale e NCI","children":[],"payload":{"tag":"li","lines":"142,143"}},{"content":"<strong>Soggette a revisione contabile obbligatoria (Audit)</strong>","children":[],"payload":{"tag":"li","lines":"143,144"}}],"payload":{"tag":"li","lines":"139,144"}},{"content":"<strong>Principi di Aggregazione e Disaggregazione</strong>","children":[{"content":"Divieto di aggregare voci dissimili per natura o funzione","children":[],"payload":{"tag":"li","lines":"145,146"}},{"content":"Restrizioni stringenti sull&apos;uso di etichette opache (&quot;Altro&quot; / &quot;Varie&quot;)","children":[],"payload":{"tag":"li","lines":"146,148"}}],"payload":{"tag":"li","lines":"144,148"}}],"payload":{"tag":"h2","lines":"120,121"}},{"content":"4. IAS 7 &#x2013; Rendiconto Finanziario","children":[{"content":"<strong>Finalit&#xe0; e Principio Fondante</strong>","children":[{"content":"&quot;Cash is King&quot;: la redditivit&#xe0; contabile non garantisce la solvibilit&#xe0; monetaria","children":[],"payload":{"tag":"li","lines":"150,151"}},{"content":"<strong>Unico prospetto redatto su base di Cassa (Cash Basis)</strong> anzich&#xe9; competenza economica","children":[],"payload":{"tag":"li","lines":"151,152"}}],"payload":{"tag":"li","lines":"149,152"}},{"content":"<strong>Oggetto: Cash &amp; Cash Equivalents</strong>","children":[{"content":"Cassa e conti correnti a vista (<em>Cash</em>)","children":[],"payload":{"tag":"li","lines":"153,154"}},{"content":"Mezzi Equivalenti (<em>Cash Equivalents</em>): investimenti a brevissimo termine prontamente convertibili, rischio minimo, <strong>scadenza originaria &lt;= 3 mesi</strong>","children":[],"payload":{"tag":"li","lines":"154,155"}},{"content":"Azioni ordinarie ESCLUSE dai mezzi equivalenti (troppo volatili)","children":[],"payload":{"tag":"li","lines":"155,156"}},{"content":"Scoperti bancari a vista: dedotti dalle disponibilit&#xe0; liquide se parte della gestione quotidiana","children":[],"payload":{"tag":"li","lines":"156,157"}}],"payload":{"tag":"li","lines":"152,157"}},{"content":"<strong>Le 3 Gestioni Finanziarie</strong>","children":[{"content":"<strong>Attivit&#xe0; Operativa (Operating)</strong>: incassi e pagamenti del core business (generazione cassa caratteristica)","children":[],"payload":{"tag":"li","lines":"158,159"}},{"content":"<strong>Attivit&#xe0; di Investimento (Investing)</strong>: acquisto/vendita di immobilizzazioni materiali (IAS 16), immateriali (IAS 38) e partecipazioni (CapEx)","children":[],"payload":{"tag":"li","lines":"159,160"}},{"content":"<strong>Attivit&#xe0; di Finanziamento (Financing)</strong>: accensione/rimborso mutui e bond, aumenti di capitale, buy-back, quota capitale leasing IFRS 16","children":[],"payload":{"tag":"li","lines":"160,161"}}],"payload":{"tag":"li","lines":"157,161"}},{"content":"<strong>Metodi di Esposizione dell&apos;Attivit&#xe0; Operativa</strong>","children":[{"content":"<strong>Metodo Diretto</strong>: espone le categorie di incassi e pagamenti lordi (clienti, fornitori, stipendi, imposte)" ":"<strong>Le Note Esplicative al Bilancio (IAS 1)</strong>","children":[{"content":"Parte inscindibile del set di bilancio","children":[],"payload":{"tag":"li","lines":"179,180"}},{"content":"Dichiarazione esplicita e senza riserve di conformit&#xe0; IFRS","children":[],"payload":{"tag":"li","lines":"180,181"}},{"content":"Sintesi delle politiche contabili rilevanti (<em>Accounting Policies</em>)","children":[],"payload":{"tag":"li","lines":"181,182"}},{"content":"Dettaglio disaggregato delle voci di SP e P&amp;L","children":[],"payload":{"tag":"li","lines":"182,183"}},{"content":"<strong>Fonti di incertezza nelle stime (<em>Sources of Estimation Uncertainty</em>)</strong>: assunzioni sul futuro con rischio significativo di rettifiche materiali entro 12 mesi","children":[],"payload":{"tag":"li","lines":"183,184"}},{"content":"Informativa su passivit&#xe0; potenziali (IAS 37), impegni futuri e parti correlate (IAS 24)","children":[],"payload":{"tag":"li","lines":"184,185"}}],"payload":{"tag":"li","lines":"178,185"}},{"content":"<strong>Management Commentary (Relazione sulla Gestione)</strong>","children":[{"content":"IFRS Practice Statement 1: guida non obbligatoria ma integrata nelle leggi nazionali (art. 2428 c.c.)","children":[],"payload":{"tag":"li","lines":"186,187"}},{"content":"Relazione narrativa &quot;attraverso gli occhi del management&quot; (<em>through the eyes of management</em>)","children":[],"payload":{"tag":"li","lines":"187,188"}},{"content":"6 Contenuti cardine: 1. Natura del business; 2. Obiettivi e strategie; 3. Risorse, relazioni e rischi; 4. Risultati economico-finanziari; 5. KPIs finanziari e non; 6. Prospettive future","children":[],"payload":{"tag":"li","lines":"188,189"}}],"payload":{"tag":"li","lines":"185,189"}},{"content":"<strong>Sustainability Reporting &amp; Nascita ISSB</strong>","children":[{"content":"Creazione dell&apos;ISSB da parte della IFRS Foundation (COP26 Glasgow 2021)","children":[],"payload":{"tag":"li","lines":"190,191"}},{"content":"Missione: creare una <em>Global Baseline</em> standardizzata di informativa ESG per i mercati dei capitali","children":[],"payload":{"tag":"li","lines":"191,192"}},{"content":"<strong>Standard IFRS S1</strong>: requisiti generali di disclosure ESG basati sui 4 pilastri TCFD (Governance, Strategia, Risk Management, Metriche &amp; Target)","children":[],"payload":{"tag":"li","lines":"192,193"}},{"content":"<strong>Standard IFRS S2</strong>: focalizzato sul Clima (rischi fisici e di transizione, calcolo emissioni Scope 1, 2 e 3)","children":[],"payload":{"tag":"li","lines":"193,194"}}],"payload":{"tag":"li","lines":"189,194"}},{"content":"<strong>Il Nodo della Doppia Materialit&#xe0; (Double Materiality)</strong>","children":[{"content":"<strong>Materialit&#xe0; Finanziaria (Outside-in)</strong>: approccio ISSB / IFRS S1-S2, impatto dei fattori ESG sul valore e sui cash flow dell&apos;impresa","children":[],"payload":{"tag":"li","lines":"195,196"}},{"content":"<strong>Materialit&#xe0; di Impatto (Inside-out)</strong>: impatto delle attivit&#xe0; aziendali sull&apos;ambiente e sulla collettivit&#xe0;","children":[],"payload":{"tag":"li","lines":"196,197"}},{"content":"<strong>Doppia Materialit&#xe0; Obbligatoria</strong>: approccio Unione Europea (CSRD ed ESRS di EFRAG), impone la rendicontazione integrata di entrambe le dimensioni","children":[],"payload":{"tag":"li","lines":"197,199"}}],"payload":{"tag":"li","lines":"194,199"}}],"payload":{"tag":"h2","lines":"177,178"}},{"content":"6. Seminario Ferrari: Finance in a Unique Business Model","children":[{"content":"<strong>Filosofia Strategica Fondativa</strong>","children":[{"content":"&quot;Ferrari will always deliver one car less than the market demands&quot; (Enzo Ferrari)","children":[],"payload":{"tag":"li","lines":"201,202"}},{"content":"Priorit&#xe0; assoluta al Valore e all&apos;Esclusivit&#xe0; rispetto ai volumi produttivi","children":[],"payload":{"tag":"li","lines":"202,203"}},{"content":"Driver dei ricavi: non le unit&#xe0; consegnate (<em>shipments</em>), ma la leva <strong>Price/Mix</strong>, le personalizzazioni e le serie speciali/Icona","children":[],"payload":{"tag":"li","lines":"203,204"}}],"payload":{"tag":"li","lines":"200,204"}},{"content":"<strong>Metriche Finanziarie di Performance d&apos;Eccellenza</strong>","children":[{"content":"<strong>Adjusted EBITDA Margin</strong>: 38.8% al 2025 (+580 bps rispetto al 2020)","children":[],"payload":{"tag":"li","lines":"205,206"}},{"content":"<strong>Free Cash Flow Industriale Cumulato (2020-25)</strong>: ~&#x20ac;5.1 miliardi","children":[],"payload":{"tag":"li","lines":"206,207"}},{"content":"<strong>Elevato Cash Conversion Ratio</strong>: trasformazione dell&apos;EBITDA in cassa reale per autofinanziare Capex industriali, R&amp;D e transizione ibrida/elettrica","children":[],"payload":{"tag":"li","lines":"207,208"}}],"payload":{"tag":"li","lines":"204,208"}},{"content":"<strong>Il Ruolo della Finanza: &quot;Finance Makes Trade-offs Visible&quot;</strong>","children":[{"content":"La finanza come partner strategico del business","children":[],"payload":{"tag":"li","lines":"209,210"}},{"content":"I 4 Grandi Trade-Off:","children":[{"content":"1. Growth vs Exclusivity (crescita vs rarit&#xe0; del brand)","children":[],"payload":{"tag":"li","lines":"211,212","listIndex":1}},{"content":"2. Innovation vs Financial Discipline (R&amp;D estrema e F1 vs controllo CapEx)","children":[],"payload":{"tag":"li","lines":"212,213","listIndex":2}},{"content":"3. Global Consistency vs Local Dynamics (omogeneit&#xe0; globale vs mercati regionali Americas/Europe/China)","children":[],"payload":{"tag":"li","lines":"213,214","listIndex":3}},{"content":"4. Short-term Performance vs Long-term Value (redditivit&#xe0; del trimestre vs conservazione del brand)","children":[],"payload":{"tag":"li","lines":"214,215","listIndex":4}}],"payload":{"tag":"li","lines":"210,215"}}],"payload":{"tag":"li","lines":"208,215"}},{"content":"<strong>Il Processo &quot;From Data to Decision&quot; in 5 Step</strong>","children":[{"content":"1. Business Question (formulare la domanda strategica)","children":[],"payload":{"tag":"li","lines":"216,217","listIndex":1}},{"content":"2. Data &amp; Assumptions (esplicitare le ipotesi sottostanti)","children":[],"payload":{"tag":"li","lines":"217,218","listIndex":2}},{"content":"3. Scenarios &amp; Sensitivities (stress test su volumi, costi e cambi)","children":[],"payload":{"tag":"li","lines":"218,219","listIndex":3}},{"content":"4. Risks &amp; Opportunities (quantificare rischi e opzioni al rialzo)","children":[],"payload":{"tag":"li","lines":"219,220","listIndex":4}},{"content":"5. Recommendation &amp; Decision (scelta tra alternative comparabili)","children":[],"payload":{"tag":"li","lines":"220,222","listIndex":5}}],"payload":{"tag":"li","lines":"215,222"}}],"payload":{"tag":"h2","lines":"199,200"}},{"content":"7. IAS 16 &#x2013; Property, Plant and Equipment","children":[{"content":"<strong>Definizione e Criteri di Rilevazione</strong>","children":[{"content":"Beni tangibili usati nella produzione, fornitura servizi, affitto o fini amministrativi per pi&#xf9; esercizi","children":[],"payload":{"tag":"li","lines":"224,225"}},{"content":"Riconoscimento: probabilit&#xe0; di benefici economici futuri + costo misurabile attendibilmente","children":[],"payload":{"tag":"li","lines":"225,226"}}],"payload":{"tag":"li","lines":"223,226"}},{"content":"<strong>Valutazione Iniziale: Composizione del Costo</strong>","children":[{"content":"Prezzo di acquisto al netto di sconti commerciali e abbuoni (+ dazi e imposte non recuperabili)","children":[],"payload":{"tag":"li","lines":"227,228"}},{"content":"Costi direttamente attribuibili (preparazione sito, trasporto, montaggio, collaudi al netto campioni venduti, perizie)","children":[],"payload":{"tag":"li","lines":"228,229"}},{"content":"<strong>Stima attualizzata dei costi di smantellamento e bonifica (Decommissioning)</stron
