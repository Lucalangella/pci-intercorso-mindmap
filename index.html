g>: non serve riprodurre il testo asettico del principio, ma spiegare come l&apos;azienda applica concretamente i criteri ai propri progetti","children":[],"payload":{"tag":"li","lines":"144,145"}},{"content":"<strong>Fonti di incertezza nelle stime (Quesito 03.2)</strong>: obbligo di indicare le ipotesi principali sul futuro e le relative analisi di sensibilit&#xe0; (<em>sensitivity analysis</em>) per variazioni ragionevolmente possibili","children":[],"payload":{"tag":"li","lines":"145,146"}},{"content":"<strong>Divieto di Sanatoria in Nota (Quesito 03.3)</strong>:","children":[{"content":"Se una societ&#xe0; opera una compensazione vietata nei prospetti esponendo i dati lordi in nota:","children":[],"payload":{"tag":"li","lines":"147,148"}},{"content":"<strong>L&apos;informativa in nota NON SANA l&apos;errore o la compensazione non consentita nei prospetti primari</strong>","children":[],"payload":{"tag":"li","lines":"148,149"}}],"payload":{"tag":"li","lines":"146,149"}}],"payload":{"tag":"li","lines":"142,149"}},{"content":"<strong>Management Commentary (IFRS Practice Statement 1 / Modulo 04)</strong>","children":[{"content":"Relazione narrativa della gestione vista &quot;attraverso gli occhi del management&quot;","children":[],"payload":{"tag":"li","lines":"150,151"}},{"content":"<strong>Trasparenza su eventi non ricorrenti (Quesito 04.1)</strong>: se l&apos;utile cresce solo per la vendita di un immobile mentre i margini operativi calano, il management deve separare il contributo straordinario e spiegare cause e prospettive del core business","children":[],"payload":{"tag":"li","lines":"151,152"}},{"content":"<strong>Gestione dei rischi e perdita clienti (Quesito 04.2)</strong>: collegare i cali di fatturato alla concentrazione dei clienti, azioni correttive e rischi residui","children":[],"payload":{"tag":"li","lines":"152,153"}},{"content":"<strong>Forward-Looking Information (Quesito 04.3)</strong>: le previsioni future sono utili agli investitori se e solo ne; Global Consistency vs Local Dynamics; Short-term Performance vs Long-term Value","children":[],"payload":{"tag":"li","lines":"167,168"}}],"payload":{"tag":"li","lines":"166,168"}},{"content":"<strong>Processo Decisionale &quot;From Data to Decision&quot;</strong>","children":[{"content":"1. Business Question -&gt; 02. Data &amp; Assumptions -&gt; 03. Scenarios/Sensitivities -&gt; 04. Risks &amp; Opps -&gt; 05. Decision","children":[],"payload":{"tag":"li","lines":"169,171","listIndex":1}}],"payload":{"tag":"li","lines":"168,171"}}],"payload":{"tag":"h2","lines":"159,160"}},{"content":"7. IAS 16 &#x2013; Property, Plant and Equipment","children":[{"content":"<strong>Costo Iniziale e Capitalizzazione</strong>","children":[{"content":"Prezzo di acquisto netto + Costi direttamente attribuibili (trasporto, installazione, collaudo al netto campioni venduti)","children":[],"payload":{"tag":"li","lines":"173,174"}},{"content":"<strong>Costi di Smantellamento e Bonifica (Decommissioning)</strong>: il valore attuale dell&apos;obbligazione futura si capitalizza subito a cespite con contropartita Fondo Rischi passivit&#xe0; IAS 37","children":[],"payload":{"tag":"li","lines":"174,175"}},{"content":"<strong>Spese ESCLUSE dal costo (sempre a P&amp;L)</strong>: formazione del personale (manca il controllo), inaugurazione, marketing e spese generali","children":[],"payload":{"tag":"li","lines":"175,176"}}],"payload":{"tag":"li","lines":"172,176"}},{"content":"<strong>Component Approach (Obbligatorio)</strong>","children":[{"content":"Ammortamento separato per parti significative con vita utile o ritmo di consumo dissimile (es. aereo fusoliera 25y vs motori 10y; terreno no ammortamento vs fabbricato)","children":[],"payload":{"tag":"li","lines":"177,178"}}],"payload":{"tag":"li","lines":"176,178"}},{"content":"<strong>Modelli di Valutazione Successiva</strong>","children":[{"content":"<strong>Cost Model</strong>: Costo - Fondo Ammortamento - Perdite per riduzione valore (IAS 36)
